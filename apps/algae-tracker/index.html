<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUP Algae Advisory Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🏄 Paddleboard Algae Advisory Tracker</h1>
      <p class="subtitle">Live freshwater HAB reports from California's FHAB open dataset.
         "No recent data" ≠ safe — it may just be unmonitored.</p>
      <div id="legend">
        <span class="badge danger">DANGER</span>
        <span class="badge warning">WARNING</span>
        <span class="badge caution">CAUTION</span>
        <span class="badge clear">CLEAR</span>
        <span class="badge clear stale">CLEAR*</span>
        <span class="badge nodata">NO DATA</span>
        <div class="legend-note">CLEAR* = no active advisory, but data is over a year old.</div>
      </div>
    </header>

    <div id="updated"></div>
    <div id="spots" class="section"><div class="loading">Loading…</div></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
