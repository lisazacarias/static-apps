<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --ground: #E1E4E1;
    --page: #FCFCFB;
    --ink: #14161A;
    --rule: #A8ADA8;
    --soft: #6E746E;
    --red: #B62B2B;      /* conductor's red pencil */
    --blue: #2C5A9E;     /* blue pencil */
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--ui); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 780px; margin: 0 auto; padding: 24px 16px 80px; }
  .page {
    background: var(--page); border: 1px solid var(--rule);
    padding: 28px 26px 32px;
  }
  h1 {
    font-family: var(--display); font-weight: 400; font-size: 30px;
    margin: 0 0 2px; letter-spacing: -0.01em;
  }
  .sub { font-family: var(--display); font-style: italic; color: var(--soft); margin: 0 0 20px; font-size: 15px; }
  .eyebrow {
    font-family: var(--display); font-style: italic; font-size: 13px;
    color: var(--red); letter-spacing: 0.04em; margin: 0 0 6px;
  }
  h2 { font-family: var(--display); font-weight: 400; font-size: 21px; margin: 0 0 14px; }
  h3 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
  p { margin: 0 0 12px; }

  /* the one thing to do next */
  .now { border-left: 3px solid var(--red); background: #F3F1ED; padding: 13px 16px; margin: 0 0 20px; }
  .now .eyebrow { margin-bottom: 4px; }
  .now p { margin: 0; font-size: 14px; max-width: 54ch; }
  .now .row { margin-top: 11px; }
  nav button.rec { position: relative; }
  nav button.rec::after {
    content: ''; position: absolute; top: 8px; right: 3px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--red);
  }

  /* progress spine */
  .spine { margin: 0 0 22px; }
  .spine svg { display: block; width: 100%; height: auto; max-width: 420px; }

  /* tabs */
  nav { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); margin: 0 0 24px; flex-wrap: wrap; }
  nav button {
    font-family: var(--ui); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 9px 13px; margin-bottom: -1px; color: var(--soft); cursor: pointer;
  }
  nav button:hover { color: var(--ink); }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }

  button:focus-visible, input:focus-visible, .keybtn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .btn {
    font-family: var(--ui); font-size: 14px; background: var(--page); color: var(--ink);
    border: 1px solid var(--rule); padding: 8px 14px; cursor: pointer;
  }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .btn.primary:hover { background: var(--red); border-color: var(--red); }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn[disabled] { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* practice slots */
  .slot {
    border-top: 1px solid var(--rule); padding: 14px 0; display: flex; gap: 14px; align-items: flex-start;
  }
  .slot:last-of-type { border-bottom: 1px solid var(--rule); }
  .slot.done .slottext { opacity: .45; }
  .slot.done h3 { text-decoration: line-through; }
  .slotnum { font-family: var(--mono); font-size: 12px; color: var(--soft); padding-top: 3px; min-width: 18px; }
  .slottext { flex: 1; }
  .slottext p { margin: 0; color: var(--soft); font-size: 14px; }
  .clock { font-family: var(--mono); font-size: 18px; min-width: 58px; text-align: right; letter-spacing: -0.02em; }
  .clock.running { color: var(--red); }
  .slotctl { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

  /* drill */
  .staffwrap { text-align: center; margin: 6px 0 16px; }
  .staffwrap svg { max-width: 100%; height: auto; }
  .clef { font-family: var(--ui); font-size: 9px; letter-spacing: 0.18em; fill: var(--soft); }
  .verdict { font-family: var(--display); font-style: italic; font-size: 16px; min-height: 24px; text-align: center; margin: 0 0 12px; }
  .verdict.ok { color: var(--blue); }
  .verdict.no { color: var(--red); }
  .letters { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .letters button { font-family: var(--display); font-size: 18px; width: 46px; height: 46px; }

  .kb { position: relative; height: 152px; margin: 0 auto; overflow-x: auto; overflow-y: hidden; }
  .kbinner { position: relative; height: 150px; }
  .keybtn { position: absolute; padding: 0; border: 1px solid var(--ink); cursor: pointer; }
  .white { background: #fff; width: 40px; height: 150px; top: 0; border-radius: 0 0 3px 3px; }
  .white:hover { background: #EDF1F7; }
  .black { background: var(--ink); width: 24px; height: 94px; top: 0; z-index: 2; border-radius: 0 0 3px 3px; }
  .black:hover { background: #3A4048; }
  .keybtn.hit { background: var(--blue); }
  .keybtn.miss { background: var(--red); }
  .kbnote { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--soft); pointer-events: none; }

  .stats { display: flex; gap: 22px; justify-content: center; margin: 16px 0 0; flex-wrap: wrap; }
  .stat { text-align: center; }
  .stat b { font-family: var(--mono); font-size: 20px; font-weight: 500; display: block; }
  .stat span { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--soft); }

  /* stages */
  .stage { border-top: 1px solid var(--rule); }
  .stage:last-child { border-bottom: 1px solid var(--rule); }
  .stagehead {
    display: flex; align-items: baseline; gap: 12px; width: 100%; text-align: left;
    background: none; border: 0; padding: 14px 0; cursor: pointer; font-family: var(--ui); font-size: 15px; color: var(--ink);
  }
  .stagenum { font-family: var(--mono); font-size: 12px; color: var(--soft); min-width: 18px; }
  .stagename { flex: 1; font-family: var(--display); font-size: 18px; }
  .badge { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--soft); }
  .badge.now { color: var(--red); }
  .badge.done { color: var(--blue); }
  .stagebody { padding: 0 0 18px 30px; font-size: 14px; }
  .stagebody .lbl { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--soft); margin: 12px 0 4px; }
  label.check { display: flex; gap: 9px; align-items: flex-start; padding: 5px 0; cursor: pointer; }
  label.check input { margin: 3px 0 0; accent-color: var(--blue); flex-shrink: 0; }

  details.ref { margin-top: 22px; border-top: 1px solid var(--rule); padding-top: 14px; }
  details.ref summary { cursor: pointer; font-family: var(--display); font-style: italic; color: var(--soft); }
  details.ref ul { padding-left: 18px; font-size: 14px; }
  details.ref li { margin-bottom: 6px; }

  /* log */
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 90px; border-bottom: 1px solid var(--rule); margin: 4px 0 6px; }
  .bar { flex: 1; background: var(--blue); min-height: 2px; }
  .bar.empty { background: var(--rule); opacity: .35; }
  .barlbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--soft); }
  .sess { display: flex; justify-content: space-between; border-top: 1px solid var(--rule); padding: 8px 0; font-size: 14px; }
  .sess span { color: var(--soft); font-family: var(--mono); font-size: 13px; }
  .empty-state { color: var(--soft); font-family: var(--display); font-style: italic; }
  @media (prefers-reduced-motion: no-preference) {
    .notehead { animation: drop .4s ease-out; }
    @keyframes drop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  }
  .stumble-hit {
    fill: transparent;
    stroke: var(--red);
    stroke-width: 1;
    stroke-dasharray: 3 3;
    cursor: pointer;
    transition: fill 80ms ease;
  }
  .stumble-hit.flash { fill: var(--red); fill-opacity: .55; }
</style>

<div class="shell">
  <div class="page">
    <h1>Piano, from choir up</h1>
    <p class="sub">Milestone-based. Advance on the exit test, not the calendar.</p>

    <div class="spine" id="spine"></div>

    <div id="now"></div>

    <nav role="tablist">
      <button role="tab" data-tab="sight" aria-selected="true">Read</button>
      <button role="tab" data-tab="reading" aria-selected="false">Drills</button>
      <button role="tab" data-tab="learn" aria-selected="false">Learn</button>
      <button role="tab" data-tab="progress" aria-selected="false">Progress</button>
    </nav>

    <div id="view"></div>
    <div id="nowfoot"></div>
  </div>
</div>

<script>
// ---------- storage ----------
const KEY = 'piano:v1';
let S = null;
const fallback = {};

const blank = () => ({
  stage: 0,
  log: [],
  lastExported: null,
  drill: { asked: 0, right: 0, streak: 0, best: 0, perNote: {}, rounds: [] },
  stumbles: [],
  muted: false,
  ignoreSilent: true,
  engine: 'auto',
  sight: { attempts: 0, key: 'random', mode: null, allKeys: false, step: 0,
           history: {}, passed: {}, focus: null, focusChosen: false },
  session: null
});

// Three tiers. Inside a Claude artifact only window.storage exists; served from
// a real origin only localStorage does. Without the second tier the app looked
// like it was saving and silently lost everything on refresh.
const localGet = () => {
  try { return window.localStorage && window.localStorage.getItem(KEY); }
  catch (e) { return null; }
}
const localSet = (v) => {
  try { if (window.localStorage) window.localStorage.setItem(KEY, v); }
  catch (e) { /* private mode, quota, or no storage at all */ }
}

async function load() {
  try {
    if (window.storage) {
      const r = await window.storage.get(KEY);
      if (r && r.value) return normalize({ ...blank(), ...JSON.parse(r.value) });
    }
  } catch (e) { /* first run, no key */ }
  try {
    const raw = localGet();
    if (raw) return normalize({ ...blank(), ...JSON.parse(raw) });
  } catch (e) { /* corrupt or unreadable */ }
  return normalize(fallback[KEY] ? { ...blank(), ...fallback[KEY] } : blank());
}

// older saves predate some fields
const normalize = (s) => {
  s.drill = { ...blank().drill, ...(s.drill || {}) };
  if (!Array.isArray(s.drill.rounds)) s.drill.rounds = [];
  if (!Array.isArray(s.log)) s.log = [];
  s.sight = { attempts: 0, key: 'random', mode: null, allKeys: false, step: 0,
              history: {}, passed: {}, focus: null, focusChosen: false, ...(s.sight || {}) };
  if (!Array.isArray(s.stumbles)) s.stumbles = [];
  if (s.sight.mode === 'major') s.sight.mode = null;          // was the old default
  if (typeof s.sight.step !== 'number') s.sight.step = 0;     // pre-ladder saves
  s.sight.history = s.sight.history || {};
  delete s.sight.streaks;                                     // pre-window-mastery saves
  s.sight.passed = s.sight.passed || {};
  // Saves from the stage era credited progress against stages, which no longer
  // exist. Anything they had cleared maps onto the first steps of the ladder.
  if (s.checks) {
    if (s.checks['1-0']) { s.sight.passed[0] = true; s.sight.passed[1] = true; s.sight.passed[2] = true; }
    if (s.checks['2-0']) { s.sight.passed[3] = true; s.sight.passed[4] = true; s.sight.passed[5] = true; }
    if (s.checks['3-0']) { s.sight.passed[6] = true; s.sight.passed[7] = true; }
    delete s.checks;
  }
  if (s.ignoreSilent === undefined) s.ignoreSilent = true;
  if (!s.engine) s.engine = 'auto';
  s.checks = s.checks || {};
  // A session can arrive here from a normal load (reopened after the tab or
  // the whole browser was closed mid-slot) or from restoring a backup, and
  // either one can be old enough to predate wall-clock timing. Both need the
  // same reconciliation, so it lives here rather than duplicated at each call
  // site — an unrecognized shape is dropped rather than left to throw
  // NaN/undefined into the timer later.
  if (s.session) {
    if (Array.isArray(s.session.slots)) {
      s.session.slots.forEach(x => {
        if (x.spent === undefined) x.spent = x.total - (x.left !== undefined ? x.left : x.total);  // pre-wall-clock saves
        if (x.running && x.startedAt) x.spent = Math.min(x.total, x.spent + (Date.now() - x.startedAt) / 1000);
        x.running = false; x.startedAt = null;
      });
    } else {
      s.session = null;
    }
  }
  return s;
}
let saveTimer = null;
const save = () => {
  fallback[KEY] = S;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const json = JSON.stringify(S);
    localSet(json);                       // works on any real origin
    try { if (window.storage) await window.storage.set(KEY, json); }
    catch (e) { console.error('Could not save progress', e); }
  }, 250);
}

// ---------- sound ----------
const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const midiOf = d => (octOf(d) + 1) * 12 + SEMI[letterOf(d)];
// The ear hears a low note as quieter than a high one at the same linear
// amplitude (equal-loudness contours), and both synthesis paths otherwise use
// one fixed peak gain regardless of pitch — without this, bass notes are
// genuinely harder to hear, not just an EQ preference. Unboosted above middle
// C, ramping to +8dB at the app's lowest playable note (E2) — a first, milder
// attempt still measured out as much quieter than the metronome in practice.
// Deliberately stops at 8dB rather than chasing full equal-loudness parity
// (15-25dB at these frequencies): the shared soft limiter has no per-voice
// headroom, so pushing further starts audibly compressing a bass note held
// under a treble one in two-hand playback.
const loudnessBoost = (midi) => Math.pow(10, Math.min(8, Math.max(0, 60 - midi) * 0.4) / 20);
let ctx = null, audioReady = false;

const ensureCtx = () => {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ctx = new AC(); } catch (e) { return null; }
  }
  if (ctx.state === 'suspended') ctx.resume();
  audioReady = ctx.state === 'running';
  return ctx;
}

// --- getting past the iPhone silent switch ---
// Safari's default audio session behaves as "ambient", which the hardware mute
// switch silences. Two ways out, both applied:
//   1. AudioSession API (Safari 16.4+): ask for the "playback" session type.
//   2. Older iOS: HTML5 <audio> is exempt from the mute switch where Web Audio
//      is not, so nudging a silent <audio> element flips the channel over.
const SILENT_WAV = 'data:audio/wav;base64,UklGRoQJAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YWAJAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA=';
let silentEl = null;

let capturing = false;   // true while the microphone is open

const armAudioSession = () => {
  // 'playback' refuses audio capture outright, so recording needs its own type
  const want = capturing ? 'play-and-record'
             : (S && S.ignoreSilent === false) ? 'auto' : 'playback';
  try {
    if (typeof navigator !== 'undefined' && navigator && 'audioSession' in navigator) {
      navigator.audioSession.type = want;
      return true;
    }
  } catch (e) { /* not supported */ }
  return false;
}

const nudgeSilent = () => {
  if (capturing) { if (silentEl) silentEl.pause(); return; }
  if (S && S.ignoreSilent === false) { if (silentEl) silentEl.pause(); return; }
  try {
    if (!silentEl) {
      silentEl = new Audio(SILENT_WAV);
      silentEl.loop = true;
      silentEl.setAttribute('playsinline', '');
    }
    const p = silentEl.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* nothing to do */ }
}

// iOS also leaves the context suspended until audio is produced inside a real
// gesture, so every touch re-arms everything. Cheap, and idempotent.
const unlockAudio = () => {
  armAudioSession();
  nudgeSilent();
  const c = ensureCtx();
  if (!c) return;
  try {
    const s = c.createBufferSource();
    s.buffer = c.createBuffer(1, 1, 22050);
    s.connect(c.destination);
    s.start(0);
  } catch (e) { /* nothing to do */ }
  audioReady = c.state === 'running';
}
if (typeof document !== 'undefined' && document.addEventListener) {
  ['pointerdown', 'touchend', 'keydown'].forEach(ev =>
    document.addEventListener(ev, unlockAudio, { passive: true }));
}

// --- media-element playback engine ---
// WKWebView (the Claude app, and any in-app browser) gives the page no way to
// set its audio category directly; only an HTML5 media element can flip it off
// "ambient". So notes get synthesised to a WAV and played through <audio>,
// which the silent switch does not touch.
// Render notes to PCM, then to a WAV container. HTML5 <audio> is exempt from the
// iOS silent switch where Web Audio is not, so this is the path that survives it.
const WAV_RATE = 22050;

// e.len is how long the note is HELD, in seconds. Without it every note rang
// for the same 1.5s and the written rhythm was inaudible.
const RELEASE = 0.28;
const renderNotes = (events, rate) => {
  rate = rate || WAV_RATE;
  const held = e => Math.max(0.12, e.len === undefined ? 1.2 : e.len);
  const end = events.reduce((a, e) => Math.max(a, e.at + held(e) + RELEASE), 0.3) + 0.1;
  const n = Math.ceil(end * rate);
  const out = new Float32Array(n);
  const parts = [[1, 1], [2, 0.3], [3, 0.12], [4, 0.05]];
  const norm = parts.reduce((a, p) => a + p[1], 0);

  for (const e of events) {
    const f = 440 * Math.pow(2, (e.midi - 69) / 12);
    const hold = held(e);
    const boost = loudnessBoost(e.midi);
    const start = Math.max(0, Math.floor(e.at * rate));
    const len = Math.min(n - start, Math.ceil((hold + RELEASE) * rate));
    for (let i = 0; i < len; i++) {
      const t = i / rate;
      // natural string decay while the key is down, damper when it lifts
      const decay = Math.exp(-t * 1.3);
      const damp = t <= hold ? 1 : Math.exp(-(t - hold) * 26);
      const env = 0.42 * boost * decay * damp * (1 - Math.exp(-t * 500));
      let s = 0;
      for (const [mult, amp] of parts) s += amp * Math.sin(2 * Math.PI * f * mult * t);
      out[start + i] += env * s / norm;
    }
  }
  for (let i = 0; i < n; i++) out[i] = Math.tanh(out[i] * 1.4);
  return out;
}

const encodeWav = (samples, rate) => {
  rate = rate || WAV_RATE;
  const n = samples.length;
  const buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  const tag = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  tag(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); tag(8, 'WAVE');
  tag(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  tag(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return buf;
}

let lastUrl = null, elAudio = null;

const playViaElement = (events) => {
  try {
    const pcm = renderNotes(events);
    const buf = encodeWav(pcm);
    const blob = new Blob([buf], { type: 'audio/wav' });
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    if (!elAudio) {
      elAudio = new Audio();
      elAudio.setAttribute('playsinline', '');
    }
    elAudio.src = lastUrl;
    const p = elAudio.play();
    if (p && p.catch) p.catch(e => { lastError = 'element play rejected: ' + e.name; });
    return true;
  } catch (e) {
    lastError = 'element render failed: ' + e.message;
    return false;
  }
}

let lastError = '';
// true when the page cannot control its own audio category — i.e. an in-app
// WebView, or any iOS browser without the AudioSession API
const needsElementAudio = () => {
  if (S && S.engine === 'element') return true;
  if (S && S.engine === 'webaudio') return false;
  const ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
  const iOS = /iPad|iPhone|iPod/.test(ua) ||
              (/Macintosh/.test(ua) && typeof navigator !== 'undefined' && navigator.maxTouchPoints > 1);
  return iOS;                       // default to the engine that survives the switch
}

// single entry point for anything that makes a sound
const playEvents = (events) => {
  if (!events || !events.length) return;
  if (S && S.muted) return;
  if (needsElementAudio() && playViaElement(events)) return;
  events.forEach(e => play(e.midi, e.at, e.len));
}

// `when` is seconds from now. Everything is scheduled on the audio clock rather
// than with setTimeout, so a whole melody is created inside the tap that asked
// for it — which is the only thing iOS will allow.
const play = (midi, when, len) => {
  if (S && S.muted) return;
  const c = ensureCtx();
  if (!c) return;
  const hold = Math.max(0.12, len === undefined ? 1.2 : len);
  const f = 440 * Math.pow(2, (midi - 69) / 12);
  const boost = loudnessBoost(midi);
  const t = c.currentTime + (when || 0) + 0.02;
  const out = c.createGain();
  const lp = c.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(Math.min(6000, f * 8), t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(400, f * 2), t + 1.1);
  out.connect(lp); lp.connect(c.destination);

  const endT = t + hold + 0.26;
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(0.3 * boost, t + 0.006);
  out.gain.exponentialRampToValueAtTime(Math.max(0.0002, 0.3 * boost * Math.exp(-hold * 1.3)), t + hold);
  out.gain.exponentialRampToValueAtTime(0.0001, endT);

  [[1, 1, 'triangle'], [2, 0.3, 'sine'], [3, 0.12, 'sine'], [4, 0.05, 'sine']]
    .forEach(([mult, amp, type]) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = f * mult;
      g.gain.value = amp;
      o.connect(g); g.connect(out);
      o.start(t); o.stop(endT + 0.05);
    });
}

const keySigStaffSVG = (key, state) => {
  const colour = state === 'ok' ? 'var(--blue)' : state === 'no' ? 'var(--red)' : 'var(--ink)';
  let lines = '';
  for (let i = 0; i < 5; i++) {
    lines += `<line x1="12" y1="${30 + i * 10}" x2="300" y2="${30 + i * 10}" stroke="var(--rule)"/>`;
    lines += `<line x1="12" y1="${90 + i * 10}" x2="300" y2="${90 + i * 10}" stroke="var(--rule)"/>`;
  }
  const sig = `<g style="--ink:${colour}">${keySigSVG(key, 'treble', 48)}${keySigSVG(key, 'bass', 48)}</g>`;
  const none = (key.sharps || key.flats) ? '' :
    `<text x="170" y="82" text-anchor="middle" font-size="13" fill="var(--soft)"
      font-family="ui-monospace, monospace">(no sharps or flats)</text>`;
  return `<svg viewBox="0 0 310 168" xmlns="http://www.w3.org/2000/svg" role="img"
    aria-label="A key signature on the grand staff">
    ${lines}<line x1="12" y1="30" x2="12" y2="130" stroke="var(--ink)" stroke-width="2"/>
    ${clefs()}${sig}${none}</svg>`;
}

const staffSVG = (d, state) => {
  const noteX = 250;
  const y = d === null ? 0 : yOf(d);
  const colour = state === 'ok' ? 'var(--blue)' : state === 'no' ? 'var(--red)' : 'var(--ink)';
  let lines = '';
  for (let i = 0; i < 5; i++) {
    lines += `<line x1="12" y1="${30 + i * 10}" x2="440" y2="${30 + i * 10}" stroke="var(--rule)" stroke-width="1"/>`;
    lines += `<line x1="12" y1="${90 + i * 10}" x2="440" y2="${90 + i * 10}" stroke="var(--rule)" stroke-width="1"/>`;
  }
  const braces = `<line x1="12" y1="30" x2="12" y2="130" stroke="var(--ink)" stroke-width="2"/>
                  <line x1="440" y1="30" x2="440" y2="130" stroke="var(--rule)" stroke-width="1"/>`;
  const clefMarks = clefs();
  let note = '';
  if (d !== null) {
    if (d === MIDDLE_C) note += `<line x1="${noteX - 15}" y1="80" x2="${noteX + 15}" y2="80" stroke="var(--ink)" stroke-width="1"/>`;
    const stemUp = d < (d >= MIDDLE_C ? 34 : 22);
    const sx = stemUp ? noteX + 7 : noteX - 7;
    const sy2 = stemUp ? y - 32 : y + 32;
    note += `<line x1="${sx}" y1="${y}" x2="${sx}" y2="${sy2}" stroke="${colour}" stroke-width="1.6"/>`;
    note += `<ellipse class="notehead" cx="${noteX}" cy="${y}" rx="7.5" ry="5.4" fill="${colour}" transform="rotate(-18 ${noteX} ${y})"/>`;
  }

}

const renderSpine = () => {
  const total = STEPS.length;
  const cleared = STEPS.filter((_, i) => stepPassed(i)).length;
  const cur = stepIndex();
  let lines = '';
  for (let i = 0; i < 5; i++) lines += `<line x1="10" y1="${8 + i * 9}" x2="410" y2="${8 + i * 9}" stroke="var(--rule)"/>`;

    if (done || now) notes += `<line x1="${x + 5}" y1="${y}" x2="${x + 5}" y2="${y - 22}" stroke="${c}" stroke-width="1.4"/>`;
    notes += `<ellipse cx="${x}" cy="${y}" rx="5.4" ry="3.9" fill="${done ? c : 'none'}"

// ---------- metronome ----------
// Rendered to a WAV of a whole number of bars and looped through a media
// element, for the same reason the notes are: it has to survive the silent
// switch, and a looping element does that where scheduled Web Audio does not.
let metroEl = null, metroUrl = null, metroBpm = 84, metroOn = false, metroBars = 8;

const renderClickTrack = (bpm, bars) => {
  const rate = WAV_RATE, spb = 60 / bpm;
  const n = Math.round(bars * 4 * spb * rate);
  const out = new Float32Array(n);
  for (let beat = 0; beat < bars * 4; beat++) {
    const accent = beat % 4 === 0;
    const f = accent ? 1600 : 1050;
    const start = Math.round(beat * spb * rate);
    const len = Math.min(n - start, Math.round(0.045 * rate));
    for (let i = 0; i < len; i++) {
      const t = i / rate;
      const env = Math.exp(-t * 90) * (accent ? 0.55 : 0.34);
      out[start + i] += env * Math.sin(2 * Math.PI * f * t);
    }
  }
  return out;
}

const startMetro = () => {
  try {
    const buf = encodeWav(renderClickTrack(metroBpm, metroBars));
    if (metroUrl) URL.revokeObjectURL(metroUrl);
    metroUrl = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    if (!metroEl) { metroEl = new Audio(); metroEl.setAttribute('playsinline', ''); metroEl.loop = true; }
    metroEl.src = metroUrl;
    const p = metroEl.play();
    if (p && p.catch) p.catch(() => {});
    metroOn = true;
  } catch (e) { metroOn = false; }
}

const stopMetro = () => {
  if (metroEl) { metroEl.pause(); metroEl.currentTime = 0; }
  metroOn = false;
}

// tap tempo: median of the gaps, which ignores one bad tap in a way a mean does not
let taps = [];
const tapTempo = () => {
  const now = Date.now();
  taps = taps.filter(t => now - t < 3000);
  taps.push(now);
  if (taps.length < 3) return null;
  const gaps = [];
  for (let i = 1; i < taps.length; i++) gaps.push(taps[i] - taps[i - 1]);
  gaps.sort((a, b) => a - b);
  const med = gaps[Math.floor(gaps.length / 2)];
  const bpm = Math.round(60000 / med);
  return (bpm >= 30 && bpm <= 240) ? bpm : null;
}

      ${[60, 72, 84, 100, 120].map(b => `<button class="btn small" data-setbpm="${b}">${b}</button>`).join('')}
    </div>
    <p style="font-size:13px;color:var(--soft);margin-top:8px;max-width:56ch">First beat of each bar is accented. Practise at the tempo where you make no errors \u2014 if that is 40, it is 40.</p>
  </div>`;
}

const wireMetronome = (root) => {
  const paint = () => {
    const v = document.getElementById('bpmval'), m = document.getElementById('bpmmark');
    if (v) v.textContent = metroBpm;
    if (m) m.textContent = tempoMark(metroBpm);
    const t = document.getElementById('metrotoggle');
    if (t) { t.textContent = metroOn ? 'Stop' : 'Start'; t.classList.toggle('primary', !metroOn); }
  };
  const setBpm = b => {
    metroBpm = Math.max(30, Math.min(240, b));
    if (metroOn) startMetro();          // re-render the loop at the new tempo
    paint();
  };
  root.querySelectorAll('[data-bpm]').forEach(b => b.onclick = () => setBpm(metroBpm + +b.dataset.bpm));
  root.querySelectorAll('[data-setbpm]').forEach(b => b.onclick = () => setBpm(+b.dataset.setbpm));
  const t = root.querySelector('#metrotoggle');
  if (t) t.onclick = () => { metroOn ? stopMetro() : startMetro(); paint(); };
  const tap = root.querySelector('#metrotap');
  if (tap) tap.onclick = () => { const b = tapTempo(); if (b) setBpm(b); };
}

// ---------- practice tab ----------
// Slot timing is wall-clock: a slot records when it started and how much time
// it had already banked. setInterval only repaints — locking the phone or
// backgrounding the tab throttles the timer but no longer loses the minutes.
let ticker = null;

const slotSpent = s => s.spent + (s.running && s.startedAt ? (Date.now() - s.startedAt) / 1000 : 0);
const slotLeft = s => Math.max(0, Math.round(s.total - slotSpent(s)));

const renderPractice = (targetId) => {
  const v = document.getElementById(targetId || 'view');
  if (!S.session) {
    v.innerHTML = `
      <p class="eyebrow">Start here</p>
      <h2>How long do you actually have?</h2>
      <p style="color:var(--soft);font-size:14px">Four twelve-minute sessions beat one fifty-minute session. Short counts.</p>
      <div class="row">
        ${[5, 10, 20, 35, 60].map(m => `<button class="btn" data-mins="${m}">${m} min</button>`).join('')}
      </div>
      ${metronomeHTML()}`;
    v.querySelectorAll('[data-mins]').forEach(b => b.onclick = () => startSession(+b.dataset.mins));
    wireMetronome(v);
    return;
  }

  const s = S.session;
  const longform = LONGFORM[s.mins];
  const allDone = s.slots.every(x => x.done);
  v.innerHTML = `
    <p class="eyebrow">${s.mins}-minute session</p>
    <h2>${allDone ? 'Done. Log it.' : 'Work the slots in order'}</h2>
    ${s.mins === 60 ? '<p style="color:var(--soft);font-size:14px">Take a break after the repertoire slot.</p>' : ''}
    ${s.slots.map((x, i) => {
      const def = SLOTS[x.id];
      return `<div class="slot ${x.done ? 'done' : ''}">
        <div class="slotnum">${i + 1}</div>
        <div class="slottext">
          <h3>${def.name}</h3>
          <p>${longform ? def.long : def.short}</p>
        </div>
        <div class="slotctl">
          <div class="clock ${x.running ? 'running' : ''}" id="clk${i}">${fmt(slotLeft(x))}</div>
          <div class="row" style="gap:6px">
            <button class="btn small" data-toggle="${i}">${x.running ? 'Pause' : x.spent > 0 ? 'Resume' : 'Start'}</button>
            <button class="btn small" data-done="${i}" ${x.done ? 'disabled' : ''}>Done</button>
          </div>
        </div>
      </div>`;
    }).join('')}
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="endsess">Log this session</button>
      <button class="btn" id="cancelsess">Discard</button>
    </div>
    ${metronomeHTML()}`;

  v.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => toggleSlot(+b.dataset.toggle));
  v.querySelectorAll('[data-done]').forEach(b => b.onclick = () => finishSlot(+b.dataset.done));
  document.getElementById('endsess').onclick = endSession;
  document.getElementById('cancelsess').onclick = () => { stopTicker(); S.session = null; save(); refreshSession(); };
  wireMetronome(v);
}

// Session state lives in the Progress tab's sesspane, but the timer needs to
// stay visible and controllable from any tab via the persistent strip. This
// updates whichever of those is actually on screen instead of always
// re-rendering #view, which would clobber a tab that isn't Progress.
const refreshSession = () => {
  if (tab === 'progress') renderPractice('sesspane');
  renderNow();
}

const startSession = (mins) => {
  S.session = {
    mins,
    slots: PLANS[mins].map(([id, m]) => ({ id, total: m * 60, spent: 0, running: false, startedAt: null, done: false }))
  };
  save(); refreshSession();
}

const pauseSlot = (x) => {
  if (x.running) { x.spent = slotSpent(x); x.running = false; x.startedAt = null; }
}

const toggleSlot = (i) => {
  const s = S.session;
  const wasRunning = s.slots[i].running;
  s.slots.forEach(pauseSlot);
  if (!wasRunning) { s.slots[i].running = true; s.slots[i].startedAt = Date.now(); startTicker(); }
  else stopTicker();
  save(); refreshSession();
}

const finishSlot = (i) => {
  const x = S.session.slots[i];
  pauseSlot(x);
  x.done = true;
  if (!S.session.slots.some(y => y.running)) stopTicker();
  save(); refreshSession();
}

const startTicker = () => {
  stopTicker();
  ticker = setInterval(() => {
    const s = S.session; if (!s) return stopTicker();
    const i = s.slots.findIndex(x => x.running);
    if (i < 0) return stopTicker();
    const el = document.getElementById('clk' + i);
    if (el) el.textContent = fmt(slotLeft(s.slots[i]));
    // duplicated into both the header and footer strip, so update every copy
    document.querySelectorAll('.nowclk').forEach(c => c.textContent = fmt(slotLeft(s.slots[i])));
    if (slotLeft(s.slots[i]) <= 0) { finishSlot(i); save(); }
  }, 500);
}
const stopTicker = () => { clearInterval(ticker); ticker = null; }

const endSession = () => {
  const s = S.session;
  s.slots.forEach(pauseSlot);
  const spent = s.slots.reduce((a, x) => a + Math.min(x.total, x.spent), 0);
  const mins = Math.max(1, Math.round(spent / 60));
  S.log.unshift({ date: today(), mins, slots: s.slots.filter(x => x.done).map(x => SLOTS[x.id].name) });
  S.log = S.log.slice(0, 400);
  S.session = null;
  stopTicker(); save();
  switchTab('progress');
}

const fmt = sec => `${Math.floor(sec / 60)}:${String(Math.max(0, sec % 60)).padStart(2, '0')}`;
const today = () => new Date().toISOString().slice(0, 10);

// ---------- reading drill ----------
let drill = { d: null, keyIdx: null, mode: 'find', minor: false, state: null, t0: 0, round: null, done: false };
let showLM = false;
let namingIdx = 0;
const ROUND_LEN = 20;
// The benchmark is 20 notes in 30 seconds. Clicking a key costs motor time
// that naming out loud does not, so the two modes get different benchmarks.
const TARGET = { name: 1.5, find: 3.0, key: 3.0, solfege: 3.0 };

const startRound = () => {
  drill.round = { n: 0, correct: 0, secs: 0 };
  drill.done = false;
  drill.d = null;
  newQuestion();
}

const advance = () => {
  if (drill.round.n >= ROUND_LEN) {
    drill.done = true;
    const per = drill.round.secs / ROUND_LEN;
    S.drill.rounds.push({
      date: today(), mode: drill.mode,
      correct: drill.round.correct, per: +per.toFixed(2)
    });
    S.drill.rounds = S.drill.rounds.slice(-200);
    // a clean fast Name round is the benchmark itself — don't make her judge it
    drill.autoChecked = false;
    if (drill.mode === 'name' && drill.round.correct === ROUND_LEN
        && per <= TARGET.name && !S.drill.namedFast) {
      S.drill.namedFast = true;
      drill.autoChecked = 'drill';
    }
    if (drill.mode === 'key' && drill.round.correct === ROUND_LEN
        && per <= TARGET.key && !S.drill.keysFast) {
      S.drill.keysFast = true;
      drill.autoChecked = 'keys';
    }
    const prev = S.drill.bestRound;
    if (!prev || drill.round.correct > prev.correct ||
        (drill.round.correct === prev.correct && per < prev.per)) {
      S.drill.bestRound = { correct: drill.round.correct, per: +per.toFixed(2), mode: drill.mode };
    }
    save();
    renderReading();
    return;
  }
  newQuestion();
  renderReading();
}

const newQuestion = () => {
  if (drill.mode === 'key') {
    let i;
    do { i = Math.floor(Math.random() * KEYS.length); } while (i === drill.keyIdx);
    drill.keyIdx = i;
  } else {
    if (drill.mode === 'solfege') {
      let i;
      do { i = Math.floor(Math.random() * KEYS.length); } while (i === drill.keyIdx);
      drill.keyIdx = i;
      drill.minor = MINOR_OK.includes(KEYS[i].name) && Math.random() < 0.5;
    }
    let d;
    do { d = LOW + Math.floor(Math.random() * (HIGH - LOW + 1)); } while (d === drill.d);
    drill.d = d;
  }
  drill.state = null; drill.t0 = Date.now();
}

const landmarkSVG = () => {
  const marks = [
    { d: dOf('C', 3), label: 'Bass C' },
    { d: dOf('F', 3), label: 'Bass F' },
    { d: MIDDLE_C,    label: 'Middle C' },
    { d: dOf('G', 4), label: 'Treble G' }
  ];
  let lines = '';
  for (let i = 0; i < 5; i++) {
    lines += `<line x1="12" y1="${30 + i * 10}" x2="440" y2="${30 + i * 10}" stroke="var(--rule)"/>`;
    lines += `<line x1="12" y1="${90 + i * 10}" x2="440" y2="${90 + i * 10}" stroke="var(--rule)"/>`;
  }
  const frame = `<line x1="12" y1="30" x2="12" y2="130" stroke="var(--ink)" stroke-width="2"/>${clefs()}`;
  const notes = marks.map((m, i) => {
    const x = 110 + i * 88, y = yOf(m.d);
    const ledger = m.d === MIDDLE_C
      ? `<line x1="${x - 15}" y1="80" x2="${x + 15}" y2="80" stroke="var(--ink)"/>` : '';
    return `${ledger}
      <ellipse cx="${x}" cy="${y}" rx="7.5" ry="5.4" fill="var(--red)" transform="rotate(-18 ${x} ${y})"/>
      <line x1="${x}" y1="${y + 8}" x2="${x}" y2="146" stroke="var(--red)" stroke-width="0.8" stroke-dasharray="2 3"/>
      <text x="${x}" y="158" text-anchor="middle" font-size="10" fill="var(--red)"
        font-family="ui-monospace, monospace">${m.label}</text>`;
  }).join('');
  return `<svg viewBox="0 0 470 168" xmlns="http://www.w3.org/2000/svg" role="img"
    aria-label="The four landmark notes on the grand staff">${lines}${frame}${notes}</svg>`;
}

const LANDMARK_NOTES = [
  ['Bass F', 'The two dots of the bass clef straddle this line. That is what the symbol is for \u2014 it is the F-clef.'],
  ['Treble G', 'The curl of the treble clef wraps this line. The G-clef.'],
  ['Middle C', 'One ledger line above the bass staff, one below the treble. Same key, written two ways.'],
  ['Bass C', 'Second space up in the bass staff, an octave below middle C.']
];

const renderReading = () => {
  if (!drill.round) startRound();
  const v = document.getElementById('view');
  const st = S.drill;

  // read this before the first round, not by accident afterwards
  if (!S.primerSeen) {
    v.innerHTML = `
      <p class="eyebrow">Read this first \u2014 two minutes</p>
      <h2>Four landmarks, then everything else</h2>
      <p style="max-width:56ch">Don\u2019t use mnemonics like \u201cGood Boys Do Fine Always.\u201d They make you count up from a letter every single time, which caps your reading speed permanently. Memorise these four cold instead, and read every other note as one or two steps from the nearest one.</p>
      <div class="staffwrap">${landmarkSVG()}</div>
      <ul style="font-size:14px;max-width:60ch;padding-left:18px">
        ${LANDMARK_NOTES.map(([n, t]) => `<li style="margin-bottom:7px"><b>${n}</b> \u2014 ${t}</li>`).join('')}
      </ul>
      <p style="max-width:56ch;color:var(--soft);font-size:14px">The drill is twenty notes. You can reopen this diagram any time with the Landmarks button.</p>
      <div class="row" style="margin-top:16px">
        <button class="btn primary" id="primerdone">Got it \u2014 start the drill</button>
      </div>`;
    document.getElementById('primerdone').onclick = () => {
      S.primerSeen = true; save(); startRound(); renderReading(); renderNow();
    };
    return;
  }

  if (drill.done) {
    const r = drill.round;
    const per = r.secs / ROUND_LEN;
    const target = TARGET[drill.mode];
    const clean = r.correct === ROUND_LEN;
    const fast = per <= target;
    let verdict;
    if (drill.autoChecked === 'drill') {
      verdict = 'Twenty of twenty inside the target. That is the note drill at speed \u2014 you are reading the landmarks now, not counting up from them.';
    } else if (drill.autoChecked === 'keys') {
      verdict = 'All seven signatures, cold, inside the target. You can name every key signature cold.';
    } else if (clean && fast && drill.mode === 'find') {
      verdict = 'Clean and inside the target. Now switch to <b>Name the letter</b> and do the same \u2014 naming from the page, with no keyboard in front of you, is the harder half.';
    } else if (clean) {
      verdict = `All twenty right, but ${per.toFixed(1)}s each against a ${target}s target. You are counting up from a landmark rather than recognising it. That resolves with repetition, not effort \u2014 run it again.`;
    } else {
      verdict = `${ROUND_LEN - r.correct} missed. Accuracy before speed \u2014 run it again, slower, and use the Landmarks button when you are unsure.`;
    }
    v.innerHTML = `
      <p class="eyebrow">Round complete</p>
      <h2>${r.correct} of ${ROUND_LEN}</h2>
      <div class="stats" style="justify-content:flex-start;margin:0 0 18px">
        <div class="stat"><b>${per.toFixed(1)}s</b><span>per note</span></div>
        <div class="stat"><b>${target}s</b><span>target</span></div>
        <div class="stat"><b>${Math.round(r.secs)}s</b><span>total</span></div>
      </div>
      <p style="max-width:46ch">${verdict}</p>
      ${weakSpots()}
      <div class="row" style="margin-top:20px">
        <button class="btn primary" id="again">Another round</button>
        ${drill.mode === 'find' && !S.drill.namedFast
          ? '<button class="btn" id="switchname">Switch to Name the letter</button>' : ''}
      </div>`;
    document.getElementById('again').onclick = () => { startRound(); renderReading(); };
    const sw = document.getElementById('switchname');
    if (sw) sw.onclick = () => { drill.mode = 'name'; startRound(); renderReading(); };
    return;
  }

  const acc = st.asked ? Math.round(st.right / st.asked * 100) : 0;
  v.innerHTML = `
    <p class="eyebrow">Note drill \u00b7 ${Math.min(ROUND_LEN, drill.round.n + 1)} of ${ROUND_LEN}</p>
    <h2>${drill.mode === 'find' ? 'Play the note'
      : drill.mode === 'key' ? 'Which major key?'
      : drill.mode === 'solfege' ? `Name the syllable \u2014 ${drill.minor ? KEYS[drill.keyIdx].relName + ' minor' : KEYS[drill.keyIdx].name + ' major'}`
      : 'Name the note'}</h2>
    <div class="row" style="margin-bottom:8px">
      <button class="btn small ${drill.mode === 'find' ? 'primary' : ''}" data-mode="find">Find the key</button>
      <button class="btn small ${drill.mode === 'name' ? 'primary' : ''}" data-mode="name">Name the letter</button>
      <button class="btn small ${drill.mode === 'key' ? 'primary' : ''}" data-mode="key">Name the key</button>
      <button class="btn small ${drill.mode === 'solfege' ? 'primary' : ''}" data-mode="solfege">Name the solf\u00e8ge</button>
      <button class="btn small ${showLM ? 'primary' : ''}" id="lm">Landmarks</button>
      <button class="btn small" id="mute" style="margin-left:auto">${S.muted ? 'Sound off' : 'Sound on'}</button>
    </div>
    ${showLM ? `<div style="border:1px solid var(--rule);padding:8px 4px;margin-bottom:12px">${landmarkSVG()}</div>` : ''}
    <div class="staffwrap">${drillStaffSVG()}</div>
    <p class="verdict ${drill.state === 'ok' ? 'ok' : drill.state === 'no' ? 'no' : ''}" id="verdict">${verdictText()}</p>
    <div id="answers">${drill.mode === 'find' ? keyboardHTML()
      : drill.mode === 'key' ? keyNamesHTML()
      : drill.mode === 'solfege' ? solfegeHTML(drill.minor)
      : lettersHTML()}</div>
    ${audioHint()}
    ${drill.mode === 'key' ? `<details class="ref" id="namebox">
      <summary>How do you work out the name from the signature?</summary>
      <div style="margin-top:14px">${renderNaming(namingIdx)}</div>
    </details>` : ''}
    <div class="stats">
      <div class="stat"><b>${drill.round.correct}</b><span>this round</span></div>
      <div class="stat"><b>${st.best}</b><span>best streak</span></div>
      <div class="stat"><b>${acc}%</b><span>all-time</span></div>
      <div class="stat"><b>${st.bestRound ? st.bestRound.correct + '/' + ROUND_LEN : '\u2014'}</b><span>best round</span></div>
    </div>`;

  v.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    drill.mode = b.dataset.mode; startRound(); renderReading();
  });
  v.querySelectorAll('[data-answer]').forEach(b => b.onclick = () => answer(b.dataset.answer, b));
  document.getElementById('mute').onclick = () => {
    S.muted = !S.muted; save();
    document.getElementById('mute').textContent = S.muted ? 'Sound off' : 'Sound on';
  };
  document.getElementById('lm').onclick = () => { showLM = !showLM; renderReading(); };
  const nb = document.getElementById('namebox');
  if (nb) {
    wireNaming(nb);
    nb.ontoggle = () => { if (!S.namingSeen) { S.namingSeen = true; save(); } };
  }
}

const verdictText = () => {
  if (drill.mode === 'key') {
    const k = KEYS[drill.keyIdx];
    if (drill.state === 'ok') return `Yes \u2014 or ${k.relName} minor, same signature.`;
    if (drill.state === 'no') return `That was ${k.name} major, or ${k.relName} minor \u2014 ${keyRule(k)}`;
    return 'Read the signature, not the notes.';
  }
  if (drill.mode === 'solfege') {
    const syllable = solfegeSyllable(drill.d, KEYS[drill.keyIdx], drill.minor);
    if (drill.state === 'ok') return 'Yes.';
    if (drill.state === 'no') return `That was ${syllable} (${nameOf(drill.d)}).`;
    return 'Which syllable is this, in the key shown?';
  }
  if (drill.state === 'ok') return 'Yes.';
  if (drill.state === 'no') return `That was ${nameOf(drill.d)}.`;
  return drill.mode === 'find' ? 'Which key is this?' : 'Which letter is this?';
}

// the two rules, stated for the key just missed
const keyRule = (k) => {
  if (!k.sharps && !k.flats) return 'no sharps or flats is C major.';
  if (k.sharps) return `last sharp is ${SHARP_ORDER[k.sharps - 1]}\u266f, and the key is one semitone above it.`;
  if (k.flats === 1) return 'a single flat is always F major.';
  return `second-to-last flat is ${FLAT_ORDER[k.flats - 2]}, and that names the key.`;
}

const keyNamesHTML = () => {
  return `<div class="letters">${KEYS.map(k =>
    `<button class="btn" style="width:auto;padding:0 14px" data-answer="${k.name}">${k.name}</button>`).join('')}</div>`;
}

const lettersHTML = () => {
  return `<div class="letters">${LETTERS.map(l =>
    `<button class="btn" data-answer="${l}">${l}</button>`).join('')}</div>`;
}

const solfegeHTML = (minor) => {
  const syllables = minor ? SOLFEGE_MINOR : SOLFEGE_MAJOR;
  return `<div class="letters">${syllables.map(s =>
    `<button class="btn" style="width:auto;padding:0 14px" data-answer="${s}">${s}</button>`).join('')}</div>`;
}

const keyboardHTML = () => {
  const whites = [];
  for (let d = dOf('C', 3); d <= dOf('C', 5); d++) whites.push(d);
  const W = 40;
  let html = '';
  whites.forEach((d, i) => {
    html += `<button class="keybtn white" data-answer="${d}" data-midi="${midiOf(d)}" style="left:${i * W}px"
              aria-label="${nameOf(d)}"><span class="kbnote">${letterOf(d) === 'C' ? nameOf(d) : ''}</span></button>`;
  });
  whites.forEach((d, i) => {
    if (i === whites.length - 1) return;
    if (['C','D','F','G','A'].includes(letterOf(d)))
      html += `<button class="keybtn black" data-answer="x" data-midi="${midiOf(d) + 1}"
                style="left:${(i + 1) * W - 12}px" aria-label="black key, ${letterOf(d)} sharp"></button>`;
  });
  return `<div class="kb"><div class="kbinner" style="width:${whites.length * W}px">${html}</div></div>`;
}

const answer = (val, btn) => {
  if (drill.state) { advance(); return; }
  const correct = drill.mode === 'find' ? String(drill.d) === val
    : drill.mode === 'key' ? KEYS[drill.keyIdx].name === val
    : drill.mode === 'solfege' ? solfegeSyllable(drill.d, KEYS[drill.keyIdx], drill.minor) === val
    : letterOf(drill.d) === val;
  // sound the key you actually pressed, then the right one if you missed it
  if (drill.mode !== 'key') {
    const ev = [];
    if (btn.dataset.midi) ev.push({ midi: +btn.dataset.midi, at: 0 });
    else if (correct) ev.push({ midi: midiOf(drill.d), at: 0 });
    if (!correct) ev.push({ midi: midiOf(drill.d), at: 0.7 });
    playEvents(ev);
  }
  drill.round.n++;
  drill.round.secs += Math.min(15, (Date.now() - drill.t0) / 1000);
  if (correct) drill.round.correct++;
  const st = S.drill;
  st.asked++;
  const key = drill.mode === 'key' ? KEYS[drill.keyIdx].name + ' maj'
    : drill.mode === 'solfege' ? `${KEYS[drill.keyIdx].name}${drill.minor ? 'm' : ''}:${nameOf(drill.d)}`
    : nameOf(drill.d);
  st.perNote[key] = st.perNote[key] || { a: 0, r: 0 };
  st.perNote[key].a++;
  if (correct) {
    st.right++; st.perNote[key].r++;
    st.streak++; st.best = Math.max(st.best, st.streak);
    drill.state = 'ok';
    btn.classList.add('hit');
    save();
    setTimeout(advance, 550);
    renderVerdictOnly();
  } else {
    st.streak = 0;
    drill.state = 'no';
    btn.classList.add('miss');
    save();
    renderVerdictOnly();
  }
}

// picks the right staff renderer for whichever drill mode is active — used both
// for the initial render and to redraw the staff in its answered colour,
// so the two can never drift out of sync with each other
const drillStaffSVG = () => drill.mode === 'key'
  ? keySigStaffSVG(KEYS[drill.keyIdx], drill.state)
  : drill.mode === 'solfege'
  ? solfegeStaffSVG(drill.d, KEYS[drill.keyIdx], drill.state)
  : staffSVG(drill.d, drill.state);

const renderVerdictOnly = () => {
  const vd = document.getElementById('verdict');
  vd.textContent = verdictText();
  vd.className = 'verdict ' + (drill.state === 'ok' ? 'ok' : 'no');
  document.querySelector('.staffwrap').innerHTML = drillStaffSVG();
  if (drill.state === 'no') {
    document.querySelectorAll('[data-answer]').forEach(b => {
      b.onclick = () => advance();
    });
  }
}

const weakSpots = () => {
  const rows = Object.entries(S.drill.perNote)
    .filter(([, v]) => v.a >= 4 && v.r / v.a < 0.8)
    .sort((a, b) => a[1].r / a[1].a - b[1].r / b[1].a).slice(0, 5);
  if (!rows.length) return '';
  return `<p style="margin-top:20px;font-size:14px;color:var(--soft)">
    <em style="font-family:var(--display)">Slowest to recognise:</em>
    ${rows.map(([n, v]) => `${n} (${Math.round(v.r / v.a * 100)}%)`).join(' \u00b7 ')}</p>`;
}

// ---------- stages ----------

const referenceBody = () => {
  return `
    <p class="lbl" style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin:14px 0 4px">Bass clef by landmark, not mnemonic</p>
    <ul>
      <li><b>Bass F</b> \u2014 the two dots of the clef straddle this line. That is what the symbol is for; it is the F-clef.</li>
      <li><b>Middle C</b> \u2014 one ledger line above the bass staff, one below the treble. Same key, written two ways.</li>
      <li><b>Treble G</b> \u2014 the curl of the clef wraps this line. The G-clef.</li>
      <li><b>Bass C</b> \u2014 second space up in the bass staff, an octave below middle C.</li>
    </ul>
    <p>Read everything else as one or two steps from the nearest landmark. Mnemonics make you count up from a letter every time, which caps your reading speed permanently.</p>
    <p class="lbl" style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin:14px 0 4px">Key signatures \u2014 two rules, no counting</p>
    <ul>
      <li>Sharps always appear in the order <b>F C G D A E B</b>; flats always in the reverse, <b>B E A D G C F</b>. Never a gap, never out of order \u2014 so three sharps is always F\u266f C\u266f G\u266f.</li>
      <li><b>Sharp keys:</b> the last sharp is the 7th degree of the key \u2014 one semitone below home. Go up a semitone. Last sharp C\u266f \u2192 D major.</li>
      <li><b>Flat keys:</b> the last flat is the 4th degree. Go down a fourth. Last flat A\u266d \u2192 E\u266d major.</li>
      <li>\u201cSecond-to-last flat\u201d is the same rule \u2014 the flats are stacked in fourths, so a fourth below the last flat is the one before it. Saying \u201cdown a fourth\u201d removes the apparent exception: with one flat there is no second-to-last, but a fourth below B\u266d is still F.</li>
      <li>The signature is stated once and holds for every bar. A B\u266d in the signature means every B in the piece is flat, in both hands, in every octave, with nothing printed on the notes.</li>
      <li>This is why the same note under your finger changes name and key between pieces \u2014 and why choir music in E\u266d feels alien until the signature is automatic.</li>
    </ul>
    <p class="lbl" style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin:14px 0 4px">Relative minors \u2014 one signature, two keys</p>
    <ul>
      <li>Every signature names <b>two</b> keys: a major and its relative minor. They use the same seven notes; what differs is which note feels like home.</li>
      <li>Find the minor by going <b>down three semitones</b> from the major tonic \u2014 the 6th degree of the major scale. C\u2192A, G\u2192E, D\u2192B, F\u2192D, B\u266d\u2192G, E\u266d\u2192C.</li>
      <li>So three flats is <b>E\u266d major or C minor</b>. The signature alone cannot tell you which. Nothing about it can.</li>
    </ul>
    <p class="lbl" style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin:14px 0 4px">Telling major from minor</p>
    <ul>
      <li><b>Look at the last bass note.</b> Most reliable test by a wide margin. Pieces end on their tonic. Three flats ending on E\u266d is E\u266d major; three flats ending on C is C minor.</li>
      <li><b>Look for accidentals the signature never mentioned.</b> This is the real giveaway. Minor raises its 7th degree to make a semitone leading up to the tonic \u2014 so C minor is speckled with B naturals even though the signature says B\u266d. Repeated accidentals on the note just below your suspected tonic means minor.</li>
      <li><b>Why the raised 7th exists:</b> the natural minor 7th sits a whole step below the tonic and does not pull home. Raising it turns the v chord into a real V, which is what makes a cadence sound finished.</li>
      <li><b>Use your ear \u2014 it is your strongest tool here.</b> Play the first chord and the last. You have sung enough minor to know it instantly; you just have not had to name it from the page before.</li>
      <li>A first note on the tonic is suggestive but unreliable \u2014 plenty of pieces open elsewhere.</li>
    </ul>
    <p class="lbl" style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin:14px 0 4px">Fingering</p>
    <ul>
      <li>Fingers number 1\u20135, thumb to pinky, on both hands. Numbers on the score are fingerings, not note names.</li>
      <li>One finger per adjacent key. Don\u2019t reuse a finger unless the music forces it.</li>
      <li>The thumb avoids black keys \u2014 it is short and pulls the hand out of position.</li>
      <li>Decide the fingering before practising, write it in pencil, then never change it. Inconsistent fingering is the main reason a passage refuses to stabilise.</li>
    </ul>
    <p class="lbl" style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin:14px 0 4px">Practice rules</p>
    <ul>
      <li>Practise at the tempo where you make zero errors, even if that is a quarter of performance speed.</li>
      <li>Three consecutive correct repetitions, or it isn\u2019t learned. One is luck.</li>
      <li>Never play through a mistake. Stop, back up two beats, fix it.</li>
      <li>Don\u2019t always start at bar one, or the opening gets fifty reps and the hard part gets six.</li>
      <li>Finish on something you can play. The last thing practised is what consolidates overnight.</li>
      <li>Forearm burning is a grip reflex, not weakness. Stop, shake out, restart slower.</li>
    </ul>
  `;
}

const referenceHTML = () => {
  return `<details class="ref"><summary>Reference \u2014 landmarks, fingering, practice rules</summary>${referenceBody()}</details>`;
}

// ---------- keys ----------
const SHARP_ORDER = ['F','C','G','D','A','E','B'];
const FLAT_ORDER  = ['B','E','A','D','G','C','F'];
const SHARP_POS = { treble: [38,35,39,36,33,37,34], bass: [24,21,25,22,19,23,20] };
const FLAT_POS  = { treble: [34,37,33,36,32,35,31], bass: [20,23,19,22,18,21,17] };

// every signature names two keys: a major and its relative minor, a minor
// third below. rel is the minor tonic letter; relName is how it's spoken.
const KEYS = [
  { name: 'C',       sharps: 0, flats: 0, tonic: 'C', rel: 'A', relName: 'A' },
  { name: 'G',       sharps: 1, flats: 0, tonic: 'G', rel: 'E', relName: 'E' },
  { name: 'D',       sharps: 2, flats: 0, tonic: 'D', rel: 'B', relName: 'B' },
  { name: 'A',       sharps: 3, flats: 0, tonic: 'A', rel: 'F', relName: 'F\u266f' },
  { name: 'F',       sharps: 0, flats: 1, tonic: 'F', rel: 'D', relName: 'D' },
  { name: 'B\u266d', sharps: 0, flats: 2, tonic: 'B', rel: 'G', relName: 'G' },
  { name: 'E\u266d', sharps: 0, flats: 3, tonic: 'E', rel: 'C', relName: 'C' }
];
// F#minor's raised 7th is E#, which is correct theory but a bad first encounter,
// so minor generation skips the three-sharp signature
const MINOR_OK = ['C','G','D','F','B\u266d','E\u266d'];

// Movable-do, do-based minor. The syllable names a scale DEGREE \u2014 the letter's
// distance from the tonic \u2014 so it never looks at the key's sharps/flats: G
// major's 7th degree is "ti" whether or not it happens to be printed as F#.
// Minor is renumbered so its own tonic is "do", with altered syllables for the
// naturally-flatted 3rd, 6th and 7th degrees (me, le, te).
const SOLFEGE_MAJOR = ['do', 're', 'mi', 'fa', 'sol', 'la', 'ti'];
const SOLFEGE_MINOR = ['do', 're', 'me', 'fa', 'sol', 'le', 'te'];
const solfegeSyllable = (d, key, minor) => {
  const tonicLetter = minor ? key.rel : key.tonic;
  const degree = ((LETTERS.indexOf(letterOf(d)) - LETTERS.indexOf(tonicLetter)) % 7 + 7) % 7;
  return (minor ? SOLFEGE_MINOR : SOLFEGE_MAJOR)[degree];
};
// Difficulty is black keys under the five-finger position PLUS accidentals to
// read in the signature — C 0, G 1, F 2, D 3, B\u266d 4, A 4, E\u266d 6.
// A shuffled bag, not independent draws. Uniform random repeated the previous
// key 35% of the time on a three-key pool and produced runs of up to seven,
// which reads as "it keeps giving me the same one" because it does.
let keyBag = [], keyBagPool = '', lastKeyDrawn = null;

const drawKey = (pool) => {
  if (pool.length === 1) return pool[0];
  const sig = pool.join(',');
  if (sig !== keyBagPool || !keyBag.length) {
    keyBagPool = sig;
    keyBag = pool.slice();
    for (let i = keyBag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [keyBag[i], keyBag[j]] = [keyBag[j], keyBag[i]];
    }
    if (keyBag[keyBag.length - 1] === lastKeyDrawn && keyBag.length > 1) {
      const swap = Math.floor(Math.random() * (keyBag.length - 1));
      [keyBag[keyBag.length - 1], keyBag[swap]] = [keyBag[swap], keyBag[keyBag.length - 1]];
    }
  }
  lastKeyDrawn = keyBag.pop();
  return lastKeyDrawn;
}

const keyByName = n => KEYS.find(k => k.name === n) || KEYS[0];

const keyAlter = (key) => {
  const a = {};
  for (let i = 0; i < key.sharps; i++) a[SHARP_ORDER[i]] = 1;
  for (let i = 0; i < key.flats; i++)  a[FLAT_ORDER[i]] = -1;
  return a;
}

const sharpGlyph = (x, y) => {
  return `<g stroke="var(--ink)">
    <line x1="${x-2.7}" y1="${y-7}" x2="${x-2.7}" y2="${y+6}" stroke-width="1.1"/>
    <line x1="${x+2.7}" y1="${y-8}" x2="${x+2.7}" y2="${y+5}" stroke-width="1.1"/>
    <line x1="${x-5}" y1="${y+2}" x2="${x+5}" y2="${y-0.3}" stroke-width="2.5"/>
    <line x1="${x-5}" y1="${y-3.2}" x2="${x+5}" y2="${y-5.5}" stroke-width="2.5"/></g>`;
}
const flatGlyph = (x, y) => {
  return `<g stroke="var(--ink)" fill="none">
    <line x1="${x-2.4}" y1="${y-12}" x2="${x-2.4}" y2="${y+4}" stroke-width="1.3"/>
    <path d="M ${x-2.4},${y-2.5} C ${x+4},${y-5.5} ${x+5},${y+2} ${x-2.4},${y+4}" stroke-width="1.7"/></g>`;
}

const naturalGlyph = (x, y) => {
  return `<g stroke="var(--ink)">
    <line x1="${x-2.6}" y1="${y-6}" x2="${x-2.6}" y2="${y+8}" stroke-width="1.2"/>
    <line x1="${x+2.6}" y1="${y-8}" x2="${x+2.6}" y2="${y+6}" stroke-width="1.2"/>
    <line x1="${x-2.6}" y1="${y+1.5}" x2="${x+2.6}" y2="${y-0.5}" stroke-width="2.3"/>
    <line x1="${x-2.6}" y1="${y-3}" x2="${x+2.6}" y2="${y-5}" stroke-width="2.3"/></g>`;
}
// what to print in front of a raised 7th, given what the signature already did
const accidentalGlyph = (x, y, resulting) => {
  return resulting === 0 ? naturalGlyph(x, y)
       : resulting > 0 ? sharpGlyph(x, y) : flatGlyph(x, y);
}

const keySigSVG = (key, clef, x0, markLast) => {
  const n = key.sharps || key.flats;
  if (!n) return '';
  const sharp = key.sharps > 0;
  const solo = clef === 'bassSolo';
  const pos = (sharp ? SHARP_POS : FLAT_POS)[solo ? 'bass' : clef];
  const yFn = clef === 'treble' ? yTreble
            : solo ? (d => 70 - (d - 18) * 5) : yBass;
  let s = '';
  for (let i = 0; i < n; i++) {
    const x = x0 + 5 + i * 9.5;
    const glyph = (sharp ? sharpGlyph : flatGlyph)(x, yFn(pos[i]));
    // the last accidental is the one the naming rule turns on
    s += (markLast && i === n - 1)
      ? `<g style="--ink:var(--red)">${glyph}</g>
         <circle cx="${x}" cy="${yFn(pos[i]) - 1}" r="9.5" fill="none" stroke="var(--red)"
           stroke-width="1" stroke-dasharray="2 2"/>`
      : glyph;
  }
  return s;
}
const keySigWidth = key => { const n = key.sharps || key.flats; return n ? n * 9.5 + 12 : 0; };

// ---------- sight-read: generation and notation ----------
const RHYTHMS = {
  1: [[4], [2,2], [2,1,1], [1,1,2], [1,1,1,1]],
  2: [[4], [2,2], [2,1,1], [1,1,2], [1,1,1,1]],
  3: [[2,2], [2,1,1], [1,1,1,1], [1,0.5,0.5,2], [0.5,0.5,1,2], [1,1,0.5,0.5,1]]
};

const mulberry = (seed) => {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// An eight-bar period, not a random walk. Bars 1-2 state a motif; 3-4 answer it;
// 5-6 restate the motif exactly; 7-8 answer it again and close on the tonic.
// Repetition is the point: reading fluently means recognising a shape you have
// already seen, which material with no shapes in it can never teach.
// Reach: how far outside the five-finger position the line is allowed to go.
// 0 = never (the hand never moves), 1 = one step either side, taken by
// stretching finger 1 or 5, 2 = wide enough that the hand must shift.
const REACH = { 0: [0, 0], 1: [1, 1], 2: [3, 3] };

const genMelody = (stage, seed, key, minor, opts) => {
  stage = Math.min(3, Math.max(1, stage));
  key = key || KEYS[0];
  minor = !!minor && MINOR_OK.includes(key.name);
  opts = opts || {};
  const hand = opts.hand || 'right';                 // right | left | both
  const reach = opts.reach === undefined ? (stage === 1 ? 0 : stage === 2 ? 1 : 2) : opts.reach;
  const rnd = mulberry(seed);
  const pick = a => a[Math.floor(rnd() * a.length)];
  const tonicLetter = minor ? key.rel : key.tonic;

  // the melody hand sits where it can be read: right hand from middle C up,
  // left hand low enough that its five-finger position fits the bass staff
  let melTonic;
  if (hand === 'left') { melTonic = dOf(tonicLetter, 3); while (melTonic > 23) melTonic -= 7; }
  else melTonic = dOf(tonicLetter, 4);

  // one melody stretches one way, not both — mixing a thumb-stretch-down with
  // a pinky-stretch-up in the same eight bars teaches two things at once.
  // Pick from whichever directions are actually usable first: melTonic can
  // sit right at the instrument's floor or ceiling (e.g. a right-hand C-major
  // tune starts on MIDDLE_C itself), which blocks one direction outright.
  const [reachDown, reachUp] = REACH[reach] || REACH[0];
  const absLo = hand === 'left' ? dOf('E', 2) : MIDDLE_C;
  const absHi = hand === 'left' ? dOf('C', 4) - 1 : dOf('A', 5);
  const canReachDown = reachDown > 0 && Math.max(absLo, melTonic - reachDown) < melTonic;
  const canReachUp = reachUp > 0 && Math.min(melTonic + 4 + reachUp, absHi) > melTonic + 4;
  const reachDir = canReachDown && canReachUp ? (rnd() < 0.5 ? 'down' : 'up')
                 : canReachDown ? 'down' : canReachUp ? 'up' : null;
  const down = reachDir === 'down' ? reachDown : 0;
  const up = reachDir === 'up' ? reachUp : 0;
  const lo = hand === 'left' ? Math.max(dOf('E', 2), melTonic - down)
                             : Math.max(MIDDLE_C, melTonic - down);
  const hi = hand === 'left' ? Math.min(melTonic + 4 + up, dOf('C', 4) - 1)
                             : Math.min(melTonic + 4 + up, dOf('A', 5));
  const clamp = d => Math.max(lo, Math.min(hi, d));
  const pats = RHYTHMS[stage];

  // focus tilts the material toward one difficulty without changing anything else
  const focus = opts.focus || null;
  const leapy = focus === 'leap';
  const turny = focus === 'turn';
  let lastSign = 0;
  const stepDelta = () => {
    const r = rnd();
    const stepChance = leapy ? 0.32 : 0.68;
    // turny biases the new step to reverse the previous one, rather than a
    // fresh coin flip each time — that's what makes a line zigzag instead of
    // wandering in one direction for a while before turning
    const sign = (turny && lastSign && rnd() < 0.75) ? -lastSign : (rnd() < 0.5 ? 1 : -1);
    const delta = r < stepChance ? sign
         : r < 0.97 ? sign * (leapy ? 3 + Math.floor(rnd() * 3) : 2 + Math.floor(rnd() * 2))
         : 0;
    if (delta !== 0) lastSign = Math.sign(delta);
    return delta;
  };

  function makeMotif(nBars) {
    let rhythms = [], tries = 0;
    const wantEighths = focus === 'eighths';
    const pool = wantEighths ? (pats.filter(r => r.some(d => d === 0.5)).length ? pats.filter(r => r.some(d => d === 0.5)) : pats) : pats;
    do {
      rhythms = [];
      for (let b = 0; b < nBars; b++) rhythms.push(pool[Math.floor(rnd() * pool.length)]);
      tries++;
    } while (tries < 12 && (rhythms[0].length < 2 ||
             rhythms.reduce((a, r) => a + r.length, 0) < 4));
    const deltas = [];
    let moved = 0;
    for (const r of rhythms) for (let k = 0; k < r.length; k++) {
      if (deltas.length === 0) { deltas.push(0); continue; }
      const d = stepDelta();
      if (d !== 0) moved++;
      deltas.push(d);
    }
    if (moved === 0 && deltas.length > 1) deltas[1] = rnd() < 0.5 ? 1 : 2;

    // reach only widens where the walk is *allowed* to go — nothing above biases
    // it to actually go there, so a "reaching out" step could silently generate
    // a melody that never leaves the five-finger position. Force one note out
    // if the walk didn't wander there on its own. Uses the real clamp(), not a
    // reimplementation of its bounds — melTonic can sit right at the instrument's
    // floor or ceiling (e.g. a right-hand C-major tune starts on MIDDLE_C itself),
    // which silently caps away one direction regardless of what down/up allow.
    if ((down > 0 || up > 0) && deltas.length > 2) {
      let cur = melTonic;
      const positions = [cur];
      for (let i = 1; i < deltas.length; i++) {
        cur = clamp(cur + deltas[i]);
        positions.push(cur);
      }
      if (!positions.some(p => p - melTonic < 0 || p - melTonic > 4)) {
        const canGoLow = clamp(melTonic - down) < melTonic;
        const canGoHigh = clamp(melTonic + 4 + up) > melTonic + 4;
        if (canGoLow || canGoHigh) {
          const goLow = canGoLow && (!canGoHigh || rnd() < 0.5);
          // nudge whichever note already sits closest to that edge — the
          // smallest possible push, so the forced note crosses the position
          // without also reading as an unrelated leap
          let i = 1;
          for (let k = 2; k < positions.length - 1; k++) { // never the last note
            if (goLow ? positions[k] < positions[i] : positions[k] > positions[i]) i = k;
          }
          const target = goLow ? clamp(melTonic - 1) : clamp(melTonic + 5);
          deltas[i] = target - positions[i - 1];
        }
      }
    }
    return { rhythms, deltas };
  }

  function realise(motif, startD, endOn) {
    const bars = [];
    let cur = clamp(startD), idx = 0;
    for (const r of motif.rhythms) {
      const notes = [];
      for (const dur of r) {
        if (idx > 0) cur = clamp(cur + motif.deltas[idx]);
        notes.push({ d: cur, dur });
        idx++;
      }
      bars.push(notes);
    }
    if (endOn !== undefined && motif.deltas.length) {
      const lastBar = bars[bars.length - 1];
      lastBar[lastBar.length - 1].d = clamp(endOn);
    }
    return bars;
  }

  const motif = makeMotif(2), answer = makeMotif(2);
  const half = clamp(melTonic + pick([1, 2, 4]));
  const line = [
    ...realise(motif, melTonic),
    ...realise(answer, melTonic, half),
    ...realise(motif, melTonic),
    ...realise(answer, melTonic, melTonic)
  ];
  line[7] = [{ d: melTonic, dur: 4 }];

  if (minor) {
    const alter = keyAlter(key);
    const seventh = ((melTonic - 1) % 7 + 7) % 7;
    const flat = line.flat();
    flat.forEach((n, i) => {
      if (((n.d % 7) + 7) % 7 !== seventh) return;
      const nxt = flat[i + 1];
      if ((nxt && nxt.d === n.d + 1) || i >= flat.length - 4) {
        n.alt = (alter[letterOf(n.d)] || 0) + 1;
      }
    });
  }

  // the other hand: held roots, or at "both" a simple moving line of its own
  function accompany(root, moving) {
    return line.map((_, i) => {
      if (i === 7) return [{ d: root, dur: 4 }];
      const deg = pick([0, 3, 4]);
      if (!moving) return [{ d: root + deg, dur: 4 }];
      const other = pick([0, 3, 4]);
      return [{ d: root + deg, dur: 2 }, { d: root + other, dur: 2 }];
    });
  }

  // "left hand" means the left hand ALONE — one staff, nothing else to read.
  // Adding the other hand is a separate, later step.
  let bars = null, bass = null;
  if (hand === 'left') {
    bass = line;
  } else if (hand === 'right') {
    bars = line;
  } else {                                  // both
    bars = line;
    let lhRoot = dOf(tonicLetter, 3);
    while (lhRoot > 23) lhRoot -= 7;
    bass = accompany(lhRoot, opts.moving !== false);
  }

  return { bars, bass, stage, seed, key, minor, hand, reach, lo, hi, melTonic };
}

// the melody staff, whichever hand is carrying it
const melodyBars = mel => (mel.hand === 'left' ? mel.bass : mel.bars);

// ---------- notation ----------
const X0 = 12, CLEFPAD = 36, BARW = 104, PERSYS = 4;
const yTreble = d => 70 - (d - 30) * 5;
const yBass   = d => 130 - (d - 18) * 5;

const melKeyLabel = mel => mel.minor
  ? `${mel.key.relName} minor` : `${mel.key.name} major`;

const melodySVG = (mel, clefFn, mark, askBar, hideKey) => {
  const hasT = !!mel.bars, hasB = !!mel.bass;
  const grand = hasT && hasB;
  // a lone bass staff is drawn in the upper slot, with the bass clef moved to it
  const yLower = grand ? yBass : d => 70 - (d - 18) * 5;
  const ksw = keySigWidth(mel.key);
  const barStart = b => X0 + CLEFPAD + ksw + b * BARW;
  const right = X0 + CLEFPAD + ksw + PERSYS * BARW;
  const sysH = grand ? 152 : 104;
  const botExtent = grand ? 146 : 96;
  const bottomY = grand ? 130 : 70;
  void yLower;
  const tint = (hand, i) => {
    if (!mark || mark.hand !== hand) return null;
    const beatMode = mark.mode === 'beat';
    if (i < mark.upto) return beatMode ? 'var(--ink)' : 'var(--blue)';
    if (i === mark.upto) return 'var(--red)';
    return 'var(--rule)';
  };
  const counters = { right: 0, left: 0 };
  let out = '';

  // one routine draws a bar on either staff, so both hands can carry a real
  // line — the bass used to be hard-coded to a single whole note per bar
  function drawBar(notes, bx0, yFn, staffTop, staffBottom, hand) {
    let g = '', beat = 0;
    const placed = notes.map(n => {
      const x = bx0 + 14 + (beat / 4) * (BARW - 24);
      beat += n.dur;
      return { ...n, x };
    });
    const groups = [];
    for (let i = 0; i < placed.length; i++) {
      if (placed[i].dur !== 0.5) continue;
      let j = i;
      while (j + 1 < placed.length && placed[j + 1].dur === 0.5) j++;
      if (j > i) { groups.push([i, j]); i = j; }
    }
    const groupOf = i => groups.find(gr => i >= gr[0] && i <= gr[1]);
    const mid = (staffTop + staffBottom) / 2;

    placed.forEach((n, i) => {
      const col = tint(hand, counters[hand]++);
      const gr = groupOf(i);
      n._col = col;
      const y = yFn(n.d);
      g += ledgers(n.x, n.d, yFn, staffTop, staffBottom);
      if (n.alt !== undefined) g += accidentalGlyph(n.x - 13, y, n.alt);
      g += noteGlyph(n.x, y, n.dur, col, gr ? false : true, mid);
      if (n.dur === 0.5 && !gr) {
        const up = y > mid, sx = up ? n.x + 6.6 : n.x - 6.6;
        const tip = up ? y - 30 : y + 30, dir = up ? 1 : -1;
        g += `<path d="M ${sx},${tip} C ${sx + 8},${tip + 7 * dir} ${sx + 9},${tip + 15 * dir} ${sx + 3},${tip + 21 * dir}"
               fill="none" stroke="${col || 'var(--ink)'}" stroke-width="2.4" stroke-linecap="round"/>`;
      }
    });

    groups.forEach(([a, b]) => {
      const ys = [];
      for (let i = a; i <= b; i++) ys.push(yFn(placed[i].d));
      const up = ys.reduce((s, y) => s + y, 0) / ys.length > mid;
      const sx = up ? 6.6 : -6.6, off = up ? -30 : 30;
      const beamY = up ? Math.min(...ys) + off : Math.max(...ys) + off;
      for (let i = a; i <= b; i++) {
        g += `<line x1="${placed[i].x + sx}" y1="${yFn(placed[i].d)}" x2="${placed[i].x + sx}" y2="${beamY}"
               stroke="${placed[i]._col || 'var(--ink)'}" stroke-width="1.5"/>`;
      }
      g += `<line x1="${placed[a].x + sx}" y1="${beamY}" x2="${placed[b].x + sx}" y2="${beamY}"
             stroke="${placed[a]._col || 'var(--ink)'}" stroke-width="3.4"/>`;
    });
    return g;
  }

  for (let sys = 0; sys < 2; sys++) {
    let g = '';
    for (let s = 0; s < 5; s++) {
      g += `<line x1="${X0}" y1="${30 + s * 10}" x2="${right}" y2="${30 + s * 10}" stroke="var(--rule)"/>`;
      if (grand) g += `<line x1="${X0}" y1="${90 + s * 10}" x2="${right}" y2="${90 + s * 10}" stroke="var(--rule)"/>`;
    }
    g += `<line x1="${X0}" y1="30" x2="${X0}" y2="${bottomY}" stroke="var(--ink)" stroke-width="2"/>`;
    g += clefFn(grand ? 'grand' : hasT ? 'treble' : 'bass');
    g += keySigSVG(mel.key, hasT ? 'treble' : 'bassSolo', X0 + CLEFPAD);
    if (grand) g += keySigSVG(mel.key, 'bass', X0 + CLEFPAD);

    for (let b = 0; b < PERSYS; b++) {
      const idx = sys * PERSYS + b;
      const bx0 = barStart(b);
      if (hasT) g += drawBar(mel.bars[idx], bx0, yTreble, 30, 70, 'right');
      if (hasB) g += drawBar(mel.bass[idx], bx0, yLower, grand ? 90 : 30, grand ? 130 : 70, 'left');
      const bx = bx0 + BARW;
      if (idx === 7) {
        g += `<line x1="${bx - 6}" y1="30" x2="${bx - 6}" y2="${bottomY}" stroke="var(--ink)"/>`;
        g += `<line x1="${bx - 1}" y1="30" x2="${bx - 1}" y2="${bottomY}" stroke="var(--ink)" stroke-width="3"/>`;
      } else {
        g += `<line x1="${bx}" y1="30" x2="${bx}" y2="${bottomY}" stroke="var(--ink)"/>`;
      }
      if (askBar) {
        g += `<rect class="stumble-hit" data-bar="${idx}" x="${bx0}" y="0"
              width="${BARW}" height="${sysH}" role="button" tabindex="0"
              aria-label="Mark bar ${idx + 1} as where it went wrong"/>`;
      }
    }
    out += `<g transform="translate(0,${sys * sysH})">${g}</g>`;
  }
  return `<svg viewBox="0 0 ${right + 8} ${sysH + botExtent}" xmlns="http://www.w3.org/2000/svg"
    role="img" aria-label="Generated eight-bar sight-reading exercise${hideKey ? '' : ' in ' + melKeyLabel(mel)}${askBar ? '. Tap a bar to mark where you stumbled.' : ''}">${out}</svg>`;
}

const noteGlyph = (x, y, dur, colour, withStem, mid) => {
  const c = colour || 'var(--ink)';
  let s = '';
  if (dur < 4 && withStem !== false) {
    const up = y > (mid === undefined ? 45 : mid), sx = up ? x + 6.6 : x - 6.6;
    s += `<line x1="${sx}" y1="${y}" x2="${sx}" y2="${up ? y - 30 : y + 30}" stroke="${c}" stroke-width="1.5"/>`;
  }
  const hollow = dur >= 2;
  // an open notehead must read as open at phone size, so the hole is filled with
  // the page colour rather than left transparent for staff lines to run through
  s += `<ellipse cx="${x}" cy="${y}" rx="7.2" ry="5.2" transform="rotate(-18 ${x} ${y})"
        fill="${hollow ? 'var(--page)' : c}" stroke="${c}" stroke-width="${hollow ? 1.7 : 0}"/>`;
  return s;
}

const ledgers = (x, d, yFn, staffTop, staffBottom) => {
  let s = '', y = yFn(d);
  for (let ly = staffBottom + 10; ly <= y; ly += 10)
    s += `<line x1="${x - 13}" y1="${ly}" x2="${x + 13}" y2="${ly}" stroke="var(--ink)"/>`;
  for (let ly = staffTop - 10; ly >= y; ly -= 10)
    s += `<line x1="${x - 13}" y1="${ly}" x2="${x + 13}" y2="${ly}" stroke="var(--ink)"/>`;
  return s;
}

// playback has to apply the key signature — the notation implies it, the synth doesn't
const melodySeq = (mel) => {
  const alter = keyAlter(mel.key);
