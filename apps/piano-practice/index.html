  const pitch = n => midiOf(n.d) + (n.alt !== undefined ? n.alt : (alter[letterOf(n.d)] || 0));
  // either staff may be absent — one hand means one staff, and this assumed
  // the treble always existed, so every left-hand melody threw on playback
  const seq = [];
  const staves = [mel.bars, mel.bass].filter(Boolean);
  const barCount = staves.length ? staves[0].length : 0;
  let t = 0;
  for (let i = 0; i < barCount; i++) {
    const barStart = t;
    let barEnd = t;
    staves.forEach(staff => {
      let lt = barStart;
      staff[i].forEach(n => { seq.push({ midi: pitch(n), beat: lt, dur: n.dur }); lt += n.dur; });
      barEnd = Math.max(barEnd, lt);
    });
    t = barEnd;
  }
  return seq;
}

// ---------- naming a key from its signature ----------
// the rules work because the last accidental always lands on a fixed scale
// degree: the last sharp is the 7th, the last flat is the 4th.
const namingFacts = (key) => {
  const n = key.sharps || key.flats;
  const sharp = key.sharps > 0;
  const letter = n ? (sharp ? SHARP_ORDER : FLAT_ORDER)[n - 1] : null;
  const lastMidi = n ? midiOf(dOf(letter, 4)) + (sharp ? 1 : -1) : null;
  // derive the tonic BY the rule, so the demonstration cannot drift from the claim
  const tonicMidi = n ? lastMidi + (sharp ? 1 : -5) : midiOf(dOf('C', 4));
  return {
    key, n, sharp, letter,
    lastName: n ? nameWithAlt(letter, sharp ? 1 : -1) : null,
    lastMidi, tonicMidi,
    order: sharp ? SHARP_ORDER : FLAT_ORDER
  };
}

const renderNaming = (idx) => {
  const key = KEYS[idx];
  const f = namingFacts(key);
  const orderRow = f.n
    ? `<p style="font-family:ui-monospace,monospace;font-size:15px;letter-spacing:.12em">
         ${f.order.map((L, i) =>
           i === f.n - 1 ? `<b style="color:var(--red)">${L}</b>`
         : i < f.n ? `<b>${L}</b>`
         : `<span style="color:var(--rule)">${L}</span>`).join(' ')}</p>`
    : '';

  let body;
  if (!f.n) {
    body = `<p style="max-width:58ch">Nothing to work out. No sharps and no flats is <b>C major</b>, or <b>A minor</b>.</p>`;
  } else if (f.sharp) {
    body = `<p style="max-width:58ch">Sharps are always added in this order, never with a gap, so ${f.n === 1 ? 'one sharp' : f.n + ' sharps'} can only be these. The one that matters is the <b style="color:var(--red)">last</b> one: <b>${f.lastName}</b>.</p>
      <p style="max-width:58ch"><b>The last sharp is always the 7th degree of the key</b> \u2014 the note one semitone below home. That is not a coincidence to memorise; it is why the rule exists. So go <b>up one semitone</b> from ${f.lastName} and you are home: <b>${key.name} major</b>.</p>`;
  } else {
    body = `<p style="max-width:58ch">Flats are always added in this order, never with a gap. Again the <b style="color:var(--red)">last</b> one does the work: <b>${f.lastName}</b>.</p>
      <p style="max-width:58ch"><b>The last flat is always the 4th degree of the key.</b> So go <b>down a fourth</b> from ${f.lastName} to get home: <b>${key.name} major</b>.</p>
      <p style="max-width:58ch;font-size:14px;color:var(--soft)">You may have been taught \u201csecond-to-last flat.\u201d That is the same thing: the flats are themselves stacked in fourths, so a fourth below the last flat <em>is</em> the one before it. Stating it as \u201cdown a fourth\u201d also removes the supposed exception \u2014 with a single flat there is no second-to-last, but a fourth below B\u266d is still F.</p>`;
  }

  const marks = {};
  if (f.n) marks[f.lastMidi] = { fill: 'var(--red)', label: f.lastName, on: '#fff' };
  marks[f.tonicMidi] = { fill: 'var(--blue)', label: key.name, on: '#fff' };
  const lo = Math.min(f.tonicMidi, f.lastMidi || f.tonicMidi) - 2;
  const hi = Math.max(f.tonicMidi, f.lastMidi || f.tonicMidi) + 2;

  return `
    <div class="row" style="justify-content:space-between;align-items:center">
      <button class="btn small" data-nav="-1">\u2190</button>
      <span class="eyebrow" style="margin:0">${idx + 1} of ${KEYS.length}</span>
      <button class="btn small" data-nav="1">\u2192</button>
    </div>
    <div class="staffwrap" style="margin:10px 0 4px">${namingStaff(key)}</div>
    ${orderRow}
    ${body}
    <div style="margin:14px 0">${miniKeys(lo, hi, marks)}</div>
    <div class="row">
      ${f.n ? `<button class="btn" data-name-play="step">${f.lastName} \u2192 ${key.name}</button>` : ''}
      <button class="btn" data-name-play="chord">Hear ${key.name} major</button>
    </div>
    <p style="max-width:58ch;margin-top:18px">And the same signature is also <b>${key.relName} minor</b> \u2014 three semitones below ${key.name}. The signature alone can never tell you which of the two it is; only the last bass note and the stray accidentals can.</p>`;
}

const namingStaff = (key) => {
  let lines = '';
  for (let i = 0; i < 5; i++) {
    lines += `<line x1="12" y1="${30 + i * 10}" x2="250" y2="${30 + i * 10}" stroke="var(--rule)"/>`;
    lines += `<line x1="12" y1="${90 + i * 10}" x2="250" y2="${90 + i * 10}" stroke="var(--rule)"/>`;
  }
  return `<svg viewBox="0 0 260 168" xmlns="http://www.w3.org/2000/svg" role="img"
    aria-label="The key signature for ${key.name} major">
    ${lines}<line x1="12" y1="30" x2="12" y2="130" stroke="var(--ink)" stroke-width="2"/>
    ${clefs()}${keySigSVG(key, 'treble', 48, true)}${keySigSVG(key, 'bass', 48, true)}</svg>`;
}

const wireNaming = (root) => {
  const key = KEYS[namingIdx];
  const f = namingFacts(key);
  root.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
    namingIdx = (namingIdx + +b.dataset.nav + KEYS.length) % KEYS.length;
    if (tab === 'learn') {
      // keep the open/closed state of the panels across a step
      const openIds = [...document.querySelectorAll('details.ref[open]')].map(d => d.id);
      renderLearn();
      openIds.forEach(id => { const d = id && document.getElementById(id); if (d) d.open = true; });
      const n = document.getElementById('learn-naming');
      if (n) { n.open = true; n.scrollIntoView({ block: 'nearest' }); }
    } else {
      renderReading();
    }
  });
  root.querySelectorAll('[data-name-play]').forEach(b => b.onclick = () => {
    if (S.muted) { S.muted = false; save(); }
    if (b.dataset.namePlay === 'step') {
      playEvents([{ midi: f.lastMidi, at: 0 }, { midi: f.tonicMidi, at: 0.62 }]);
    } else {
      playEvents([0, 4, 7].map(i => ({ midi: f.tonicMidi + i, at: 0 })));
    }
  });
}

// ---------- why the raised 7th ----------
const WHITE_PC = [0,2,4,5,7,9,11];
const isWhite = m => WHITE_PC.includes(((m % 12) + 12) % 12);
const PC_NAME = { 0:'C', 2:'D', 4:'E', 5:'F', 7:'G', 9:'A', 11:'B' };

const nameWithAlt = (letter, alt) => {
  return letter + (alt > 0 ? '\u266f' : alt < 0 ? '\u266d' : '');
}

// small keyboard spanning lo..hi semitones, with specific notes called out.
// labels sit inside the keys — three notes this close together collide if the
// text hangs underneath.
const miniKeys = (lo, hi, marks) => {
  const W = 30, H = 100, BW = 18, BH = 62;
  const whites = [];
  for (let m = lo; m <= hi; m++) if (isWhite(m)) whites.push(m);
  const xOf = m => whites.indexOf(m) * W;
  let keys = '', labels = '';

  whites.forEach(m => {
    const mk = marks[m];
    keys += `<rect x="${xOf(m)}" y="0" width="${W}" height="${H}" rx="2"
      fill="${mk ? mk.fill : '#fff'}" stroke="var(--ink)" stroke-width="1"/>`;
    if (mk) labels += `<text x="${xOf(m) + W / 2}" y="${H - 9}" text-anchor="middle"
      font-size="12" font-weight="600" fill="${mk.on}" font-family="ui-monospace, monospace">${mk.label}</text>`;
  });

  whites.forEach((m, i) => {
    if (i === whites.length - 1) return;
    const b = m + 1;
    if (isWhite(b) || b > hi) return;
    const mk = marks[b];
    const bx = (i + 1) * W - BW / 2;
    keys += `<rect x="${bx}" y="0" width="${BW}" height="${BH}" rx="2"
      fill="${mk ? mk.fill : 'var(--ink)'}" stroke="var(--ink)"/>`;
    if (mk) labels += `<text x="${bx + BW / 2}" y="${BH - 8}" text-anchor="middle"
      font-size="11" font-weight="600" fill="${mk.on}" font-family="ui-monospace, monospace">${mk.label}</text>`;
  });

  return `<svg viewBox="-2 0 ${whites.length * W + 4} ${H + 4}"
    style="max-width:${whites.length * W + 4}px;width:100%;height:auto"
    xmlns="http://www.w3.org/2000/svg" role="img"
    aria-label="Keyboard showing the seventh and the tonic">${keys}${labels}</svg>`;
}

const playChord = (midis, at) => {              // kept for single-shot use
  playEvents(midis.map(m => ({ midi: m, at: at || 0 })));
}

const raisedSeventhFacts = (key) => {
  const alter = keyAlter(key);
  const tonicD = dOf(key.rel, 4);
  const sevD = tonicD - 1;
  const sevLetter = letterOf(sevD);
  const natAlt = alter[sevLetter] || 0;
  const tonicMidi = midiOf(tonicD) + (alter[key.rel] || 0);
  const natMidi = midiOf(sevD) + natAlt;
  return {
    key, tonicD, tonicMidi,
    tonicName: nameWithAlt(key.rel, alter[key.rel] || 0),
    natName: nameWithAlt(sevLetter, natAlt),
    raisedName: nameWithAlt(sevLetter, natAlt + 1),
    natMidi, raisedMidi: natMidi + 1,
    printsNatural: natAlt + 1 === 0,
    domRoot: tonicMidi - 5              // the 5th degree, a fourth below the tonic
  };
}

const renderWhy = (key) => {
  const f = raisedSeventhFacts(key);
  const lo = f.natMidi - 3, hi = f.tonicMidi + 2;
  const marks = {};
  marks[f.natMidi]    = { fill: 'var(--rule)', label: f.natName,    on: 'var(--ink)' };
  marks[f.raisedMidi] = { fill: 'var(--red)',  label: f.raisedName, on: '#fff' };
  marks[f.tonicMidi]  = { fill: 'var(--blue)', label: f.tonicName,  on: '#fff' };

  return `
    <p style="max-width:58ch">Home is <b>${f.tonicName}</b>. The note just below home is supposed to lead you there \u2014 but only if it is close enough to feel like it is pointing somewhere.</p>
    <p style="max-width:58ch">In ${f.tonicName} minor that note is <b>${f.natName}</b>, a whole step below: <b>two keys away</b>. Two keys is far enough that it does not sound like it is going anywhere. It sounds like a resting place of its own. Raise it to <b>${f.raisedName}</b> and it is <b>one key away</b> \u2014 close enough that it stops sounding like a note and starts sounding like an arrow.</p>
    <div style="margin:16px 0">${miniKeys(lo, hi, marks)}</div>
    <p style="font-size:13px;color:var(--soft);max-width:58ch;margin-top:-4px">
      <span style="color:var(--ink)">Grey</span> is the natural 7th, two keys from home.
      <span style="color:var(--red)">Red</span> is that same note raised, one key from home.
      <span style="color:var(--blue)">Blue</span> is home.</p>
    <p style="max-width:58ch;font-size:14px;color:var(--soft)">Play both. The difference is obvious in about one second, and no amount of reading will do what hearing it does.</p>
    <div class="row">
      <button class="btn" data-why="nat">${f.natName} \u2192 ${f.tonicName}</button>
      <button class="btn" data-why="raised">${f.raisedName} \u2192 ${f.tonicName}</button>
    </div>
    <p style="max-width:58ch;margin-top:20px">That is the whole reason. Minor\u2019s own scale does not contain a note close enough to home to make an ending feel like an ending, so one gets borrowed. The signature is <b>not</b> rewritten \u2014 which is why the raised note has to be printed every single time it appears, and why minor music looks cluttered with accidentals.</p>
    <p class="eyebrow" style="margin-top:20px">The same note, doing it to a chord</p>
    <p style="max-width:58ch">The chord built on the fifth degree is naturally minor in a minor key. Swap that one note and it turns major \u2014 and suddenly it pulls hard toward home. This is the sound of a cadence being finished rather than merely stopped.</p>
    <div class="row">
      <button class="btn" data-why="vmin">minor chord, then home</button>
      <button class="btn" data-why="vmaj">major chord, then home</button>
    </div>
    ${f.printsNatural ? `<p style="max-width:58ch;margin-top:18px;font-size:14px">One wrinkle specific to ${f.tonicName} minor: the signature already flattened that note, so raising it is written as a <b>natural sign</b>, not a sharp. You are cancelling the signature, not sharpening past it.</p>` : ''}`;
}

const wireWhy = (root, key) => {
  const f = raisedSeventhFacts(key);
  const beat = 0.62;                          // seconds
  const chord = (roots, third) => roots.concat([]).map(r => r);
  const acts = {
    nat:    () => playEvents([{ midi: f.natMidi, at: 0 }, { midi: f.tonicMidi, at: beat }]),
    raised: () => playEvents([{ midi: f.raisedMidi, at: 0 }, { midi: f.tonicMidi, at: beat }]),
    vmin:   () => playEvents([
                    ...[0, 3, 7].map(i => ({ midi: f.domRoot + i, at: 0 })),
                    ...[0, 3, 7].map(i => ({ midi: f.tonicMidi + i, at: beat * 1.6 }))]),
    vmaj:   () => playEvents([
                    ...[0, 4, 7].map(i => ({ midi: f.domRoot + i, at: 0 })),
                    ...[0, 3, 7].map(i => ({ midi: f.tonicMidi + i, at: beat * 1.6 }))])
  };
  root.querySelectorAll('[data-why]').forEach(b => b.onclick = () => {
    if (S.muted) { S.muted = false; save(); }
    acts[b.dataset.why]();
  });
}

// ---------- where the fingers go ----------
// Home position is the thumb on the tonic and one finger per scale step above
// it. Which of those land on black keys changes with the key, so the shape has
// to be derived from the actual melody rather than drawn once.
// Right hand counts up from the thumb; left hand counts down from the little
// finger. A note one step outside the position is a stretch of the outer finger;
// anything further needs the hand to move.
const fingerFor = (off, isLeft) => {
  if (off >= 0 && off <= 4) return { finger: isLeft ? 5 - off : off + 1, how: 'in' };
  if (off === -1) return { finger: isLeft ? 5 : 1, how: 'stretch-down' };
  if (off === 5)  return { finger: isLeft ? 1 : 5, how: 'stretch-up' };
  return { finger: null, how: 'shift' };
}

const fingerPlan = (mel) => {
  const alter = keyAlter(mel.key);
  const pitch = n => midiOf(n.d) + (n.alt !== undefined ? n.alt : (alter[letterOf(n.d)] || 0));
  const tonicLetter = mel.minor ? mel.key.rel : mel.key.tonic;
  const leftMelody = mel.hand === 'left';

  const melTonic = mel.melTonic;
  let accRoot = leftMelody ? dOf(tonicLetter, 4) : dOf(tonicLetter, 3);
  if (!leftMelody) while (accRoot > 23) accRoot -= 7;

  const build = (notes, rootD, isLeft) => {
    const map = new Map();
    notes.forEach(n => {
      const off = n.d - rootD, m = pitch(n);
      const f = fingerFor(off, isLeft);
      if (!map.has(m) || (map.get(m).finger === null && f.finger !== null))
        map.set(m, { finger: f.finger, how: f.how, d: n.d, alt: n.alt });
    });
    return map;
  };

  const melNotes = melodyBars(mel).flat();
  const accStaff = leftMelody ? mel.bars : mel.bass;
  const accNotes = accStaff ? accStaff.flat() : null;

  const melMap = build(melNotes, melTonic, leftMelody);
  const accMap = accNotes ? build(accNotes, accRoot, !leftMelody) : null;

  // the hand rests on all five keys whether or not the tune touches them all,
  // so the diagram has to show the position, not just the notes played
  const homeOf = (rootD, isLeft) => [0, 1, 2, 3, 4].map(i => ({
    midi: pitch({ d: rootD + i }), finger: isLeft ? 5 - i : i + 1
  }));
  const melHome = homeOf(melTonic, leftMelody);
  const accHome = accNotes ? homeOf(accRoot, !leftMelody) : null;

  return {
    rh: leftMelody ? accMap : melMap,
    lh: leftMelody ? melMap : accMap,
    melMap, accMap, melHome, accHome, leftMelody,
    tonicD: melTonic, bassRootD: leftMelody ? melTonic : accRoot,
    accRoot, pitch, alter, tonicLetter
  };
}

const handBoard = (map, home) => {
  const marks = {};
  // every finger of the home position first, faded where the tune never lands
  (home || []).forEach(h => {
    marks[h.midi] = { fill: '#B9C6DA', label: String(h.finger), on: '#33455E' };
  });
  [...map.keys()].forEach(m => {
    const e = map.get(m);
    const stretch = e.how === 'stretch-up' || e.how === 'stretch-down';
    marks[m] = e.finger
      ? { fill: stretch ? '#7A5C1F' : 'var(--blue)', label: String(e.finger), on: '#fff' }
      : { fill: 'var(--red)', label: '\u2022', on: '#fff' };
  });
  const all = Object.keys(marks).map(Number);
  if (!all.length) return '';
  return miniKeys(Math.min(...all) - 2, Math.max(...all) + 2, marks);
}

const fingeringDiagram = (mel) => {
  const p = fingerPlan(mel);
  const nm = d => nameWithAlt(letterOf(d), p.alter[letterOf(d)] || 0);
  const left = p.leftMelody;
  const melName = left ? 'Left hand' : 'Right hand';
  const accName = left ? 'Right hand' : 'Left hand';
  const anchor = left ? 'Little finger (5)' : 'Thumb (1)';
  const home = [0, 1, 2, 3, 4].map(i => nm(p.tonicD + i));
  const vals = [...p.melMap.values()];
  const stretches = vals.filter(e => e.how === 'stretch-up' || e.how === 'stretch-down');
  const shifts = vals.filter(e => e.how === 'shift');
  const blacks = [0, 1, 2, 3, 4].filter(i => (p.alter[letterOf(p.tonicD + i)] || 0) !== 0);
  const blackFingers = blacks.map(i => left ? 5 - i : i + 1).sort();

  return `
    <p style="max-width:58ch;font-size:14px"><b>${melName} home position:</b> ${anchor} on <b>${home[0]}</b>, then one finger per step \u2014 ${home.join(' \u00b7 ')}. ${left ? 'The left hand counts the other way: 5 on the lowest note, thumb on the highest.' : ''} Set it there before you play a note and do not look down again.</p>
    ${blacks.length ? `<p style="max-width:58ch;font-size:14px">In this key, finger ${blackFingers.join(' and ')} sits on a <b>black key</b>. That changes the shape of the hand, which is most of why a new key feels unfamiliar even when the notes are the same distance apart.</p>` : ''}
    <p class="eyebrow" style="margin-top:16px">${melName} \u2014 the tune</p>
    <div style="overflow-x:auto">${handBoard(p.melMap, p.melHome)}</div>
    ${p.accMap ? `<p class="eyebrow" style="margin-top:16px">${accName} \u2014 accompaniment</p>
      <div style="overflow-x:auto">${handBoard(p.accMap, p.accHome)}</div>
      <p style="max-width:58ch;font-size:14px;margin-top:8px">${left ? 'Thumb (1)' : 'Little finger (5)'} on <b>${nm(p.accRoot)}</b>. Only ${p.accMap.size} notes, so that hand can stay put.</p>` : ''}
    <p style="font-size:13px;color:var(--soft);max-width:58ch;margin-top:12px">Numbers are fingers \u2014 1 is the thumb on both hands. All five are shown because the hand rests on all five; <span style="color:#7A93BC">the pale ones are keys this particular tune never touches</span>, so leave the finger resting there.
      ${stretches.length ? `<span style="color:#7A5C1F"><b>Amber</b> is a stretch:</span> ${stretches.map(e =>
          `${nm(e.d)} with finger ${e.finger}`).join(', ')} \u2014 reach out with that finger and let the rest of the hand stay where it is.` : ''}
      ${shifts.length ? `<span style="color:var(--red)"><b>Red dots</b> are outside reach entirely</span> \u2014 the hand has to move. Work out where it lands before you start, not mid-bar.` : ''}
      ${!stretches.length && !shifts.length ? 'Every note falls under a finger without moving the hand.' : ''}</p>`;
}

// ---------- play along ----------
// Renders the melody and a click track into one audio file and plays it as a
// unit, so the two can never drift apart. Replaced microphone pitch-checking,
// which was reliable in testing and not in a real room.
let playState = 'off';          // off | counting | playing
let playEl = null, playUrl = null, playTimer = null, playStart = 0;
let playBpm = 84, playOnsets = [], playBeats = 0, playMode = 'both';

const renderPlayAlong = (mel, bpm, mode) => {
  const rate = WAV_RATE, spb = 60 / bpm;
  playBeats = melodyBars(mel).reduce((a, b) => a + b.reduce((x, n) => x + n.dur, 0), 0);
  const totalBeats = 4 + playBeats + 2;
  const n = Math.ceil(totalBeats * spb * rate) + rate;
  const out = new Float32Array(n);

  if (mode !== 'melody') {
    for (let b = 0; b < totalBeats; b++) {
      const countIn = b < 4;
      const accent = countIn || (b - 4) % 4 === 0;
      const f = countIn ? 1750 : accent ? 1600 : 1050;
      const start = Math.round(b * spb * rate);
      const len = Math.min(n - start, Math.round(0.045 * rate));
      for (let i = 0; i < len; i++) {
        const t = i / rate;
        out[start + i] += Math.exp(-t * 90) * (accent ? 0.5 : 0.3) * Math.sin(2 * Math.PI * f * t);
      }
    }
  }

  if (mode !== 'click') {
    const events = melodySeq(mel).map(x => ({
      midi: x.midi, at: 4 * spb + x.beat * spb, len: x.dur * spb
    }));
    const notes = renderNotes(events, rate);
    for (let i = 0; i < notes.length && i < n; i++) out[i] += notes[i];
  }

  for (let i = 0; i < n; i++) out[i] = Math.tanh(out[i]);
  return out;
}

const startPlayAlong = (mode) => {
  stopMetro();
  stopPlayAlong(true);
  playMode = mode;
  playBpm = metroBpm;
  const spb = 60 / playBpm;
  playOnsets = rhythmOnsets(mel, playBpm);

  try {
    const buf = encodeWav(renderPlayAlong(mel, playBpm, mode));
    if (playUrl) URL.revokeObjectURL(playUrl);
    playUrl = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    if (!playEl) { playEl = new Audio(); playEl.setAttribute('playsinline', ''); }
    playEl.src = playUrl;
    const p = playEl.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* the cursor still runs */ }

  playStart = Date.now() + 4 * spb * 1000;
  playState = 'counting';
  renderSight();
  playTimer = setInterval(playTick, 60);
}

const playTick = () => {
  const spb = 60 / playBpm;
  const elapsed = (Date.now() - playStart) / 1000;
  if (playState === 'counting') {
    if (elapsed >= 0) { playState = 'playing'; renderSight(); return; }
    const el = document.getElementById('playcount');
    if (el) el.textContent = String(Math.ceil(-elapsed / spb));
    return;
  }
  if (elapsed > playOnsets[playOnsets.length - 1] + 2.2) { stopPlayAlong(); return; }
  let passed = 0;
  while (passed < playOnsets.length && playOnsets[passed] <= elapsed + 0.06) passed++;
  const cur = Math.max(0, passed - 1);
  const sc = document.getElementById('melscore');
  if (sc) sc.innerHTML = melodySVG(mel, clefsFor,
    { hand: mel.hand === 'left' ? 'left' : 'right', upto: cur, mode: 'beat' });
  const bar = document.getElementById('playbar');
  if (bar) bar.style.width = Math.max(0, Math.min(100, elapsed / spb / playBeats * 100)) + '%';
}

const stopPlayAlong = (quiet) => {
  if (playTimer) clearInterval(playTimer);
  playTimer = null;
  if (playEl) { playEl.pause(); playEl.currentTime = 0; }
  playState = 'off';
  if (!quiet) renderSight();
}

const PLAY_MODES = [
  ['both',   'Melody + click', 'Hear how it should go.'],
  ['click',  'Click only',     'You play; the click keeps time.'],
  ['melody', 'Melody only',    'No click, just the tune.']
];

const playAlongPanel = () => {
  if (playState === 'counting' || playState === 'playing') {
    const counting = playState === 'counting';
    return `<div style="height:5px;background:var(--rule);margin:10px 0">
        <div id="playbar" style="height:5px;width:0%;background:var(--red)"></div></div>
      <p style="font-size:14px;max-width:56ch">${counting
        ? 'Counting in\u2026'
        : 'The red note is where the beat is now. Play along, or just listen.'}</p>
      ${counting ? `<p id="playcount" style="font-family:var(--mono);font-size:44px;margin:4px 0">4</p>` : ''}
      <div class="row"><button class="btn" id="playstop">Stop</button></div>`;
  }
  return `<p style="font-size:14px;max-width:58ch">Play it back at <b>${metroBpm} bpm</b> (set by the metronome below), with four clicks counting in. A cursor on the score follows the beat, so you can see where you should be as well as hear it.</p>
    <div class="row">
      ${PLAY_MODES.map(([id, label]) =>
        `<button class="btn ${id === 'both' ? 'primary' : ''}" data-play="${id}">${label}</button>`).join('')}
    </div>
    <p style="font-size:13px;color:var(--soft);margin-top:8px;max-width:58ch">${
      PLAY_MODES.map(([, l, d]) => `<b>${l}</b> \u2014 ${d}`).join('<br>')}</p>`;
}

const wirePlayAlong = (root) => {
  root.querySelectorAll('[data-play]').forEach(b => b.onclick = () => startPlayAlong(b.dataset.play));
  const s = root.querySelector('#playstop');
  if (s) s.onclick = () => stopPlayAlong();
}

// ---------- rhythm check ----------
// The click runs the whole way through, not just a count-in: tapping in silence
// tests holding a pulse in your head, which is a different and much harder skill
// than playing in time with a beat. A cursor tracks the click, not the taps —
// the beat position is known exactly, so it can never mislead.
let tapState = 'off';      // off | counting | running | done
let tapTimes = [], tapExpected = [], tapStart = 0, tapTimer = null, tapResult = null;
let tapEl = null, tapUrl = null, tapLast = null, tapBpm = 84, tapTotalBeats = 0;

const rhythmOnsets = (mel, bpm) => {
  const spb = 60 / bpm;
  const out = [];
  let beat = 0;
  melodyBars(mel).forEach(bar => bar.forEach(n => { out.push(beat * spb); beat += n.dur; }));
  return out;
}

const rhythmTrack = (bpm, totalBeats) => {
  const rate = WAV_RATE, spb = 60 / bpm;
  const beats = 4 + totalBeats + 2;                 // count-in, the piece, a tail
  const n = Math.round(beats * spb * rate);
  const out = new Float32Array(n);
  for (let b = 0; b < beats; b++) {
    const countIn = b < 4;
    const accent = countIn || (b - 4) % 4 === 0;
    const f = countIn ? 1750 : accent ? 1600 : 1050;
    const start = Math.round(b * spb * rate);
    const len = Math.min(n - start, Math.round(0.045 * rate));
    for (let i = 0; i < len; i++) {
      const t = i / rate;
      out[start + i] += Math.exp(-t * 90) * (accent ? 0.55 : 0.32) * Math.sin(2 * Math.PI * f * t);
    }
  }
  return out;
}

const startRhythm = () => {
  stopMetro();                                   // one click track at a time
  tapBpm = metroBpm;
  tapExpected = rhythmOnsets(mel, tapBpm);
  tapTotalBeats = melodyBars(mel).reduce((a, b) => a + b.reduce((x, n) => x + n.dur, 0), 0);
  tapTimes = []; tapResult = null; tapLast = null;
  const spb = 60 / tapBpm;

  try {
    const buf = encodeWav(rhythmTrack(tapBpm, tapTotalBeats));
    if (tapUrl) URL.revokeObjectURL(tapUrl);
    tapUrl = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    if (!tapEl) { tapEl = new Audio(); tapEl.setAttribute('playsinline', ''); }
    tapEl.src = tapUrl;
    const p = tapEl.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* the check still works silently */ }

  tapStart = Date.now() + 4 * spb * 1000;        // downbeat, after the four counts
  tapState = 'counting';
  renderSight();
  tapTimer = setInterval(rhythmTick, 60);
}

const rhythmTick = () => {
  const spb = 60 / tapBpm;
  const elapsed = (Date.now() - tapStart) / 1000;
  if (tapState === 'counting') {
    if (elapsed >= 0) {
      tapState = 'running';
      const lbl = document.getElementById('countin');
      const pad = document.getElementById('tappad');
      if (lbl && pad) {                       // swap in place; do not move the button
        lbl.textContent = 'TAP';
        pad.style.fontSize = '20px';
        pad.classList.add('primary');
        const fb = document.getElementById('tapfb');
        if (fb) fb.textContent = '\u2014';
      } else renderSight();
      return;
    }
    const el = document.getElementById('countin');
    if (el) el.textContent = String(Math.ceil(-elapsed / spb));
    return;
  }
  const last = tapExpected[tapExpected.length - 1];
  if (elapsed > last + 1.8) { finishRhythm(); return; }
  paintBeat(elapsed);
}

// the cursor follows the click, so a missed tap cannot desync it
const paintBeat = (elapsed) => {
  let passed = 0;
  while (passed < tapExpected.length && tapExpected[passed] <= elapsed + 0.06) passed++;
  const cur = Math.max(0, passed - 1);   // the note now sounding, not the next one
  const sc = document.getElementById('melscore');
  if (sc) sc.innerHTML = melodySVG(mel, g => g ? clefs() : trebleOnlyClefs(),
    { hand: 'right', upto: cur, mode: 'beat' });
  const bar = document.getElementById('beatbar');
  if (bar) {
    const pct = Math.max(0, Math.min(100, elapsed / (60 / tapBpm) / tapTotalBeats * 100));
    bar.style.width = pct + '%';
  }
}

const registerTap = () => {
  if (tapState !== 'running') return;
  const t = (Date.now() - tapStart) / 1000;
  tapTimes.push(t);
  // nearest expected onset, for immediate feedback
  let bestDiff = 1e9;
  tapExpected.forEach(e => { const d = t - e; if (Math.abs(d) < Math.abs(bestDiff)) bestDiff = d; });
  tapLast = bestDiff;
  const fb = document.getElementById('tapfb');
  if (fb) {
    const ms = Math.round(bestDiff * 1000);
    const good = Math.abs(ms) <= 60;
    fb.textContent = good ? 'on the beat' : ms < 0 ? `${-ms}ms early` : `${ms}ms late`;
    fb.style.color = good ? 'var(--blue)' : 'var(--red)';
  }
  const c = document.getElementById('tapcount');
  if (c) c.textContent = tapTimes.length + ' / ' + tapExpected.length;
}

const finishRhythm = () => {
  if (tapTimer) clearInterval(tapTimer);
  tapTimer = null;
  if (tapEl) tapEl.pause();
  const spb = 60 / tapBpm;
  const window = Math.min(0.2, Math.max(0.09, spb * 0.22));
  const used = new Set();
  let hit = 0; const offsets = [];
  tapExpected.forEach(exp => {
    let best = -1, bestDiff = 1e9;
    tapTimes.forEach((t, i) => {
      if (used.has(i)) return;
      const d = Math.abs(t - exp);
      if (d < bestDiff) { bestDiff = d; best = i; }
    });
    if (best >= 0 && bestDiff <= window) { used.add(best); hit++; offsets.push(tapTimes[best] - exp); }
  });
  const mean = offsets.length ? offsets.reduce((a, b) => a + b, 0) / offsets.length : 0;
  const spread = offsets.length > 1
    ? Math.sqrt(offsets.reduce((a, b) => a + (b - mean) * (b - mean), 0) / offsets.length) : 0;
  tapResult = { hit, of: tapExpected.length, extra: Math.max(0, tapTimes.length - hit), mean, spread, window };
  tapState = 'done';
  renderSight();
}

const stopRhythm = () => {
  if (tapTimer) clearInterval(tapTimer);
  tapTimer = null;
  if (tapEl) tapEl.pause();
  tapState = 'off'; renderSight();
}

const rhythmPanel = () => {
  // counting and running share one layout so the pad is already in place, and
  // in the same spot, before the first note arrives
  if (tapState === 'counting' || tapState === 'running') {
    const counting = tapState === 'counting';
    return `<p style="font-size:14px;max-width:56ch">${counting
        ? 'Get your thumb on the pad. Start tapping on the first note \u2014 one tap per note, along with the clicks.'
        : 'Tap once per note, along with the clicks. The red note is where the beat is now.'}</p>
      <div style="height:5px;background:var(--rule);margin:10px 0">
        <div id="beatbar" style="height:5px;width:0%;background:var(--red)"></div></div>
      <button class="btn ${counting ? '' : 'primary'}" id="tappad"
        style="width:100%;height:120px;font-size:${counting ? '46px' : '20px'};font-family:${counting ? 'var(--mono)' : 'inherit'}">
        <span id="countin">${counting ? '4' : 'TAP'}</span></button>
      <div class="row" style="justify-content:space-between;margin-top:8px">
        <span id="tapfb" style="font-family:var(--mono);font-size:15px;color:var(--soft)">${counting ? 'counting in' : '\u2014'}</span>
        <span id="tapcount" style="font-family:var(--mono);font-size:15px">0 / ${tapExpected.length}</span>
      </div>
      <div class="row"><button class="btn small" id="tapstop">${counting ? 'Cancel' : 'Stop'}</button></div>`;
  }
  if (tapState === 'done' && tapResult) {
    const r = tapResult;
    const pct = Math.round(r.hit / r.of * 100);
    const ms = Math.round(r.mean * 1000), sd = Math.round(r.spread * 1000);
    const drift = Math.abs(ms) < 25 ? 'Centred \u2014 neither rushing nor dragging.'
      : ms < 0 ? `Ahead of the beat by ${-ms}ms on average. Rushing usually means you are anticipating the notes you find hard.`
               : `Behind the beat by ${ms}ms on average. Dragging usually means the reading is the bottleneck, not the rhythm \u2014 drop the tempo.`;
    const tight = sd < 45 ? 'Your spacing is even, which is the part that matters most.'
      : `Your taps vary by about ${sd}ms around that average, so unevenness is the bigger problem here. Even spacing first; where the beat sits can wait.`;
    const good = pct >= 90 && sd < 45 && !r.extra;
    return `<div class="now" style="border-left-color:${good ? 'var(--blue)' : 'var(--red)'}">
      <p class="eyebrow" style="color:${good ? 'var(--blue)' : 'var(--red)'}">${r.hit} of ${r.of} in time${sd >= 45 ? ', but uneven' : ''}</p>
      <p style="font-size:14px">${drift} ${tight}${r.extra ? ` ${r.extra} extra tap${r.extra === 1 ? '' : 's'} landed nowhere near a note.` : ''}</p>
      <p style="font-size:13px;color:var(--soft);margin-top:6px">Judged at ${tapBpm} bpm, \u00b1${Math.round(r.window * 1000)}ms counted as on time.</p>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="tapagain">Again</button></div>
    </div>`;
  }
  return `<p style="font-size:14px;max-width:58ch">Tap the rhythm rather than playing it \u2014 pitch is ignored, so a wrong note cannot spoil a rhythm you got right. Four clicks count you in at <b>${metroBpm} bpm</b> (set by the metronome below), the click keeps going throughout, and a cursor on the score shows where the beat is.</p>
    <div class="row"><button class="btn" id="tapstart">Count me in at ${metroBpm}</button></div>`;
}

const wireRhythm = (root) => {
  const s = root.querySelector('#tapstart');
  if (s) s.onclick = () => startRhythm();
  const pad = root.querySelector('#tappad');
  if (pad) pad.onclick = () => registerTap();
  const st = root.querySelector('#tapstop');
  if (st) st.onclick = () => stopRhythm();
  const ag = root.querySelector('#tapagain');
  if (ag) ag.onclick = () => { tapState = 'off'; tapResult = null; renderSight(); };
}

// ---------- what went wrong ----------
// A stumble used to record nothing. Marking WHICH bar takes one tap and turns
// "I keep messing up" into something with a cause attached.
const FEATURES = [
  ['leap',      'a leap of a fourth or more'],
  ['leapDown',  'a leap of a fourth or more, going down'],
  ['outPos',    'a note outside the hand position'],
  ['weakFinger','a note taken with the 4th or 5th finger'],
  ['blackKey',  'a black key'],
  ['eighths',   'eighth notes'],
  ['accidental','an accidental the key signature did not warn you about'],
  ['turn',      'the line changing direction'],
  ['ledger',    'a ledger-line note']
];

const barFeatures = (mel, barIdx) => {
  const bars = melodyBars(mel);
  const bar = bars[barIdx] || [];
  const prevBar = bars[barIdx - 1] || [];
  const prev = prevBar[prevBar.length - 1];
  const alter = keyAlter(mel.key);
  const p = fingerPlan(mel);
  const notes = prev ? [prev].concat(bar) : bar.slice();

  let leap = 0, leapDown = 0, turn = 0, lastDir = 0;
  for (let i = 1; i < notes.length; i++) {
    const d = notes[i].d - notes[i - 1].d;
    leap = Math.max(leap, Math.abs(d));
    if (d <= -3) leapDown = 1;
    const dir = Math.sign(d);
    if (dir && lastDir && dir !== lastDir) turn++;
    if (dir) lastDir = dir;
  }
  const isBlack = n => (n.alt !== undefined ? n.alt : (alter[letterOf(n.d)] || 0)) !== 0;
  const yFn = mel.hand === 'left' && mel.bass ? yBass : yTreble;
  const top = mel.hand === 'left' && mel.bass ? 90 : 30, bot = mel.hand === 'left' && mel.bass ? 130 : 70;
  const fingerOf = n => { const f = p.melMap.get(p.pitch(n)); return f ? f.finger : null; };

  return {
    leap: leap >= 3 ? 1 : 0,
    leapDown,
    outPos: bar.some(n => (n.d - p.tonicD) < 0 || (n.d - p.tonicD) > 4) ? 1 : 0,
    weakFinger: bar.some(n => fingerOf(n) === 4 || fingerOf(n) === 5) ? 1 : 0,
    blackKey: bar.some(isBlack) ? 1 : 0,
    eighths: bar.some(n => n.dur === 0.5) ? 1 : 0,
    accidental: bar.some(n => n.alt !== undefined) ? 1 : 0,
    turn: turn >= 2 ? 1 : 0,
    ledger: bar.some(n => yFn(n.d) < top || yFn(n.d) > bot) ? 1 : 0
  };
}

// how common each feature is across the whole melody, as the yardstick
const melodyBaseline = (mel) => {
  const n = melodyBars(mel).length;
  const sum = {};
  FEATURES.forEach(([k]) => sum[k] = 0);
  for (let i = 0; i < n; i++) {
    const f = barFeatures(mel, i);
    FEATURES.forEach(([k]) => sum[k] += f[k]);
  }
  const base = {};
  FEATURES.forEach(([k]) => base[k] = sum[k] / n);
  return base;
}

const recordStumble = (mel, barIdx) => {
  S.stumbles = S.stumbles || [];
  S.stumbles.push({
    date: today(), step: stepIndex(), key: mel.key.name, minor: !!mel.minor,
    hand: mel.hand, reach: mel.reach, bar: barIdx,
    feat: barFeatures(mel, barIdx), base: melodyBaseline(mel)
  });
  S.stumbles = S.stumbles.slice(-200);
  save();
}

// observed vs. what chance alone would give
// Thresholds set by measurement, not taste: at five observations and 1.8x a
// purely random stumbler is flagged about 5% of the time. The looser 3-and-1.4
// tried first flagged noise in roughly a third of runs.
const INSIGHT_MIN_N = 8, INSIGHT_MIN_OBS = 5, INSIGHT_RATIO = 1.8;

const stumbleInsight = () => {
  const list = S.stumbles || [];
  if (list.length < INSIGHT_MIN_N) return { enough: false, n: list.length };
  // stumbles recorded before feat/base existed have neither — this used to be
  // reached only from the insight panel deep in the page, but newMelody() now
  // calls it on every melody (for auto-focus), so it can't throw on old data
  // without breaking the Sight tab from loading at all
  const rows = FEATURES.map(([k, label]) => {
    const obs = list.reduce((a, s) => a + ((s.feat && s.feat[k]) || 0), 0);
    const exp = list.reduce((a, s) => a + ((s.base && s.base[k]) || 0), 0);
    return { k, label, obs, exp, ratio: exp > 0.5 ? obs / exp : null };
  }).filter(r => r.ratio !== null && r.obs >= INSIGHT_MIN_OBS)
    .sort((a, b) => b.ratio - a.ratio);
  return { enough: true, n: list.length, rows };
}

// whether a detected weakness is something the generator can actually dial
// up right now, given the current step's rhythm/reach
const focusableFeature = k => {
  const step = curStep();
  const canEighths = (RHYTHMS[step.rhythm] || []).some(r => r.some(d => d === 0.5));
  const atMaxReach = step.reach >= 2;
  return k === 'leap' ? true :
    k === 'turn' ? true :
    k === 'eighths' ? canEighths :
    k === 'outPos' ? !atMaxReach : false;
};

// the strongest focusable weakness, if any \u2014 this is what melodies weight
// toward by default, unless the player has explicitly chosen otherwise
const autoFocus = () => {
  const ins = stumbleInsight();
  if (!ins.enough) return null;
  const top = ins.rows.find(r => r.ratio >= INSIGHT_RATIO && focusableFeature(r.k));
  return top ? top.k : null;
};

const effFocus = () => S.sight.focusChosen ? (S.sight.focus || null) : autoFocus();

const insightPanel = () => {
  const ins = stumbleInsight();
  if (!ins.enough) {
    return `<details class="ref" style="margin-top:20px">
      <summary>What you stumble on</summary>
      <div style="margin-top:12px"><p style="font-size:14px;max-width:58ch">${ins.n
        ? `${ins.n} of ${INSIGHT_MIN_N} stumbles recorded. Below that the comparison is not worth making \u2014 with a handful of marks, ordinary chance throws up a convincing-looking pattern about a third of the time.`
        : `Nothing recorded yet. Marking a stumble asks which bar; after ${INSIGHT_MIN_N} the app can compare those bars against the rest of the melody and say what they have in common.`}</p></div>
    </details>`;
  }
  const strong = ins.rows.filter(r => r.ratio >= INSIGHT_RATIO);
  const cur = effFocus();

  return `<details class="ref" open style="margin-top:20px">
    <summary>What you stumble on \u2014 ${ins.n} recorded</summary>
    <div style="margin-top:12px">
      ${strong.length
        ? `<p style="font-size:14px;max-width:58ch">Compared with the rest of the melody, the bars you trip on contain these far more often than chance would give:</p>
           <ul style="font-size:14px;max-width:58ch;padding-left:18px">
             ${strong.slice(0, 3).map(r => `<li style="margin-bottom:6px"><b>${r.label}</b> \u2014 ${r.obs} of your ${ins.n} stumbles, against ${r.exp.toFixed(1)} expected. <span style="color:var(--red)">${r.ratio.toFixed(1)}\u00d7</span></li>`).join('')}
           </ul>`
        : `<p style="font-size:14px;max-width:58ch">No single feature stands out yet \u2014 your stumbles look spread across the ordinary difficulty of the material rather than concentrated on one thing. That is a decent sign; keep going and check again.</p>`}
      ${strong.some(r => focusableFeature(r.k)) ? `
        <p class="eyebrow" style="margin-top:14px">Practise that on purpose</p>
        <div class="row">
          ${strong.filter(r => focusableFeature(r.k)).slice(0, 3).map(r =>
            `<button class="btn small ${cur === r.k ? 'primary' : ''}" data-focus="${r.k}">${r.label}</button>`).join('')}
          <button class="btn small ${!cur ? 'primary' : ''}" data-focus="none">Ordinary mix</button>
        </div>
        <p style="font-size:13px;color:var(--soft);margin-top:6px;max-width:58ch">${cur && S.sight.focusChosen
          ? 'Melodies are now weighted toward that. Everything else \u2014 key, hand, step \u2014 is unchanged, so it is the same exercise with the hard thing made frequent.'
          : cur
          ? 'Melodies are automatically weighted toward your strongest weakness. Choose one yourself, or Ordinary mix, to override this.'
          : 'Weighting melodies toward a weakness is the fastest way to fix it, and the least pleasant. Short bursts.'}</p>` : ''}
      ${strong.length && !strong.some(r => focusableFeature(r.k)) ? `<p style="font-size:13px;color:var(--soft);margin-top:10px;max-width:58ch">There is no weighting to offer for that at your current step \u2014 ${
        strong[0].k === 'eighths' ? 'eighth notes only appear from step 9 onward' :
        strong[0].k === 'outPos' ? 'you are already at the widest reach' :
        'it is not something the generator can dial up'}.</p>` : ''}
      <p style="font-size:13px;color:var(--soft);margin-top:12px;max-width:58ch">Read this as a hint, not a verdict \u2014 it compares your marked bars against how often each feature appears anyway, so it corrects for the obvious objection that leaps are simply common.</p>
      <div class="row" style="margin-top:8px"><button class="btn small" id="clearstumbles">Clear this history</button></div>
    </div>
  </details>`;
}

// ---------- what this stage is working on ----------
// Every option says which stage it belongs to, so choosing one is a decision
// rather than a guess. Nothing is locked — but "ahead of you" is now visible.
const KEYS_C    = ['C'];
const KEYS_EASY = ['C', 'G', 'F'];
const KEYS_MID  = ['C', 'G', 'D', 'F', 'B\u266d'];
const KEYS_ALL  = ['C', 'G', 'D', 'A', 'F', 'B\u266d', 'E\u266d'];

// One ladder, one axis of difficulty. Every step adds exactly one new thing to
// the step before it, and nothing else changes. Hands, reach, keys, mode and
// rhythm all live here — there is no second progression running alongside.
const STEPS = [
  { label: 'Right hand, C major', hand: 'right', reach: 0, keys: KEYS_C, mode: 'major', rhythm: 1,
    why: 'One hand, one position, no sharps or flats. Nothing moves.' },
  { label: 'Right hand, three keys', hand: 'right', reach: 0, keys: KEYS_EASY, mode: 'major', rhythm: 1,
    why: 'Adds G and F, so you have to read the signature before you start.' },
  { label: 'Left hand', hand: 'left', reach: 0, keys: KEYS_EASY, mode: 'major', rhythm: 1,
    why: 'The same again in the bass clef, where the fingering runs the other way.' },
  { label: 'Right hand, reaching out (C only)', hand: 'right', reach: 1, keys: KEYS_C, mode: 'major', rhythm: 1,
    why: 'Notes just past the thumb and little finger, taken by stretching — in the one key you already know cold, so the stretch is the only new thing.' },
  { label: 'Right hand, reaching out', hand: 'right', reach: 1, keys: KEYS_EASY, mode: 'major', rhythm: 1,
    why: 'The same stretch, now in G and F too.' },
  { label: 'Left hand, reaching out', hand: 'left', reach: 1, keys: KEYS_EASY, mode: 'major', rhythm: 1,
    why: 'The same stretch, mirrored.' },
  { label: 'Both hands', hand: 'both', reach: 0, keys: KEYS_EASY, mode: 'major', rhythm: 1,
    why: 'Two staves at once, but neither hand moves. Expect this one to be slow.' },
  { label: 'Both hands, reaching out', hand: 'both', reach: 1, keys: KEYS_EASY, mode: 'major', rhythm: 1,
    why: 'Two staves, and both hands stretching.' },
  { label: 'More keys \u2014 D and B\u266d', hand: 'both', reach: 1, keys: KEYS_MID, mode: 'major', rhythm: 1,
    why: 'Two sharps and two flats, so more fingers land on black keys.' },
  { label: 'Quicker notes', hand: 'both', reach: 1, keys: KEYS_MID, mode: 'major', rhythm: 3,
    why: 'Eighth notes, beamed in pairs. The reading gets denser, not wider.' },
  { label: 'Minor keys', hand: 'both', reach: 1, keys: KEYS_MID, mode: 'mixed', rhythm: 3,
    why: 'Same signatures, different home note \u2014 and the raised 7th brings accidentals the signature never mentioned.' },
  { label: 'All seven keys', hand: 'both', reach: 1, keys: KEYS_ALL, mode: 'mixed', rhythm: 3,
    why: 'Adds A, and E\u266d with three fingers on black keys.' },
  { label: 'Hand shifts', hand: 'both', reach: 2, keys: KEYS_ALL, mode: 'mixed', rhythm: 3,
    why: 'Wide enough that the hand has to move to a new position mid-phrase.' }
];

// Mastery is a rolling window, not a consecutive streak: requiring 3 in a row
// was tried and was a wall, not a checkpoint, so it was dialed back to a bare
// 2. A window keeps the evidence a single lucky pass could never provide,
// without one unlucky read wiping out everything — a stumble just ages out
// after WINDOW more attempts instead of resetting the count to zero.
const WINDOW = 5, WINDOW_TARGET = 4;
const stepWindow = i => (S.sight.history && S.sight.history[i]) || [];
const stepCleanCount = i => stepWindow(i).filter(x => x === 'ok').length;
// returns whether this specific outcome is what tipped the step over into passed
const recordStepOutcome = (i, outcome) => {
  S.sight.history = S.sight.history || {};
  const wasPassed = stepPassed(i);
  const w = stepWindow(i).concat(outcome).slice(-WINDOW);
  S.sight.history[i] = w;
  if (w.filter(x => x === 'ok').length >= WINDOW_TARGET) S.sight.passed[i] = true;
  return !wasPassed && stepPassed(i);
};
const windowProgressText = i => {
  const w = stepWindow(i);
  return w.length
    ? `${stepCleanCount(i)} of your last ${w.length} clean (need ${WINDOW_TARGET} of ${WINDOW})`
    : `${WINDOW_TARGET} of your next ${WINDOW} reads clean`;
};
const stepPassed = i => !!(S.sight.passed && S.sight.passed[i]);
const curStep = () => STEPS[stepIndex()] || STEPS[0];

// The ladder unlocks on its own progress, not on formal stage promotion. Gating
// it on the stage meant clearing a step never opened the next one, because the
// stage was itself waiting on tests done away from the app.
const unlockedThrough = () => {
  let last = -1;
  STEPS.forEach((_, i) => { if (stepPassed(i)) last = i; });
  return Math.min(STEPS.length - 1, last + 1);
}

// stored directly now: several steps share a hand and reach and differ only in
// keys, mode or rhythm, so it can no longer be inferred from those
const stepIndex = () => Math.max(0, Math.min(STEPS.length - 1, S.sight.step || 0));

const stepPicker = () => {
  const cur = stepIndex();
  const unlocked = unlockedThrough();
  const done = stepPassed(cur);
  const cleared = STEPS.filter((_, i) => stepPassed(i)).length;
  return `
    <p class="eyebrow" style="margin-top:22px">What you are reading</p>
    <div style="border:1px solid var(--rule);border-left:3px solid ${done ? 'var(--blue)' : 'var(--red)'};padding:10px 12px;margin-bottom:10px">
      <p style="margin:0;font-size:15px"><b>${cur + 1}. ${STEPS[cur].label}</b>
        ${done ? '<span style="color:var(--blue);font-size:13px"> \u2713 cleared</span>' : ''}</p>
      <p style="margin:4px 0 0;font-size:14px;color:var(--soft)">${STEPS[cur].why}</p>
      ${done ? '' : `<p style="margin:6px 0 0;font-size:14px"><b>${windowProgressText(cur)}</b> to clear this step.</p>`}
    </div>
    <div class="row">
      <button class="btn small" data-step="${Math.max(0, cur - 1)}" ${cur === 0 ? 'disabled' : ''}>\u2190 Easier</button>
      <button class="btn small" data-step="${Math.min(STEPS.length - 1, cur + 1)}" ${cur === STEPS.length - 1 ? 'disabled' : ''}>Harder \u2192</button>
      <span style="font-size:13px;color:var(--soft)">step ${cur + 1} of ${STEPS.length}</span>
    </div>
    <div class="row" style="margin-top:8px">
      ${STEPS.map((s, i) => {
        const locked = i > unlocked;
        const done = stepPassed(i);
        const style = locked ? 'opacity:.5'
          : done && i !== cur ? 'border-color:var(--blue);color:var(--blue)'
          : i === unlocked && !done && i !== cur ? 'border-color:var(--red);color:var(--red)' : '';
        return `<button class="btn small ${i === cur ? 'primary' : ''}" data-step="${i}"
          title="${s.label}" style="${style}">${i + 1}${done ? '<sup style="font-size:9px">\u2713</sup>' : ''}</button>`;
      }).join('')}
    </div>
    <p style="font-size:13px;color:var(--soft);margin-top:6px;max-width:58ch">${cleared} of ${STEPS.length} cleared. <span style="color:var(--red)">Step ${unlocked + 1} is the next one open</span>${unlocked + 1 < STEPS.length ? `; ${unlocked + 2}\u2013${STEPS.length} unlock as you clear the ones before them` : ''}. Nothing is locked for good \u2014 you can jump ahead, and if a step feels overwhelming that is information rather than failure, so drop back one.</p>`;
}

// ---------- sight-read view ----------
let mel = null, melPlaying = false;
// the melody just judged, so it can be brought back to work on
let prevMel = null, lastVerdict = null, askBar = false, justClearedStep = false;
let keyIdentified = false, keyIdMsg = '';
// pending "lock and flash" timeout from tapping a bar in activateBar(); cancelled
// on the next renderSight() or on leaving the sight tab so it can't fire stale
let stumbleTimer = null;

// The ladder step governs the HANDS. Keys and minor are reading difficulty, not
// hand difficulty, so they follow the stage instead — and by default you never
// have to set either. Overriding is possible but tucked away.
const defaultMode = () => curStep().mode;
const effMode = () => S.sight.mode || defaultMode();
const followingDefaults = () => !S.sight.mode && S.sight.key === 'random' && !S.sight.allKeys;

const allowedKeys = () => {
  return S.sight.allKeys ? KEYS_ALL : curStep().keys;
}

const newMelody = () => {
  const m = effMode();
  const wantMinor = m === 'minor' || (m === 'mixed' && Math.random() < 0.5);
  let pool = allowedKeys();
  if (wantMinor) pool = pool.filter(k => MINOR_OK.includes(k));
  if (!pool.length) pool = allowedKeys();
  let name = S.sight.key;
  if (name === 'random' || !pool.includes(name)) name = drawKey(pool);
  const step = curStep();
  const focus = effFocus();
  const reach = focus === 'outPos' ? Math.min(2, step.reach + 1) : step.reach;
  mel = genMelody(step.rhythm, (Math.random() * 1e9) | 0, keyByName(name), wantMinor,
    { hand: step.hand, reach, focus });
  keyIdentified = false; keyIdMsg = '';
}

const trebleOnlyClefs = () => { return clefs().split('</g>')[0] + '</g>'; }
const bassOnlyClefs = () => { return clefs().split('</g>')[1] + '</g>'; }
// a lone bass staff sits in the upper slot, so its clef moves up with it
const clefsFor = (mode) => {
  if (mode === 'grand' || mode === true) return clefs();
  if (mode === 'bass') return `<g transform="translate(0,-60)">${bassOnlyClefs()}</g>`;
  return trebleOnlyClefs();
}

const playMelody = (bpm) => {
  if (melPlaying || S.muted) return;
  melPlaying = true;
  const spb = 60 / bpm;                       // seconds per beat
  const seq = melodySeq(mel);
  playEvents(seq.map(n => ({ midi: n.midi, at: n.beat * spb, len: n.dur * spb })));
  const total = seq.reduce((a, n) => Math.max(a, n.beat + n.dur), 0) * spb * 1000;
  setTimeout(() => {                          // UI only, no audio depends on this
    melPlaying = false;
    const b = document.getElementById('hear');
    if (b) b.textContent = 'Hear it';
  }, total + 500);
}

const renderSight = () => {
  if (stumbleTimer) { clearTimeout(stumbleTimer); stumbleTimer = null; }
  if (!mel) newMelody();
  const v = document.getElementById('view');
  const alter = keyAlter(mel.key);
  const blacks = Object.keys(alter);
  // explain in the key she is actually reading, unless it has no usable minor
  const explainKey = MINOR_OK.includes(mel.key.name) ? mel.key : keyByName('C');
  // while a check is running the score has to stay on screen — it is the thing
  // being read, and it was previously scrolled far above the tap pad
  const checkRunning = tapState === 'counting' || tapState === 'running'
    || playState === 'counting' || playState === 'playing';
  const sigDesc = blacks.length
    ? `${blacks.join(' and ')} ${blacks.length > 1 ? 'are' : 'is'} ${mel.key.sharps ? 'sharpened' : 'flattened'}`
    : 'no sharps or flats';
  const raised = melodyBars(mel).flat().filter(n => n.alt !== undefined).length;
  const keyNote = mel.minor
    ? `${mel.key.relName} minor \u2014 same signature as ${mel.key.name} major (${sigDesc}), different home note. It ends on ${mel.key.relName}, not ${mel.key.name}.` +
      (raised ? ` The accidentals you can see are the raised 7th: the signature never mentioned them, and that is the giveaway that this is minor.` : '')
    : `${mel.key.name} major: ${sigDesc}. The signature says so once, at the start, and means it for every bar \u2014 nothing is printed on the notes themselves.`;
  const hands = mel.hand === 'both'
    ? 'Both hands moving. Learn each alone first, then together.'
    : `${mel.hand === 'left' ? 'Left' : 'Right'} hand alone.`;

  v.innerHTML = `
    <p class="eyebrow">Generated \u00b7 eight bars${keyIdentified ? ` \u00b7 ${melKeyLabel(mel)}` : ''} \u00b7 step ${stepIndex() + 1}</p>
    <h2>Sight-read this once</h2>
    ${keyIdentified
      ? `<p style="max-width:56ch;font-size:14px"><b>${keyNote}</b></p>`
      : `<p style="max-width:56ch;font-size:14px"><b>Which key signature is this?</b> Read it off the staff below before you start.</p>
         <div class="row" style="margin-bottom:8px">${KEYS.map(k =>
           `<button class="btn small" data-keyid="${k.name}">${k.name}</button>`).join('')}</div>
         ${keyIdMsg ? `<p style="font-size:13px;color:var(--red);margin:0 0 8px">${keyIdMsg}</p>` : ''}`}
    <p style="max-width:56ch;font-size:14px">${hands} Play it through <b>once, without stopping</b>, even if you fumble. Stopping to fix things turns sight-reading into memorising \u2014 a different skill, and not the one this trains.</p>
    <div id="melscore" style="${checkRunning
        ? 'position:sticky;top:0;z-index:5;background:var(--page);box-shadow:0 6px 10px -8px rgba(0,0,0,.35);'
        : ''}border:1px solid var(--rule);padding:10px 4px;margin:14px 0;overflow-x:auto">
      ${melodySVG(mel, clefsFor, null, askBar, !keyIdentified)}
    </div>

    <p class="eyebrow" style="margin-top:20px">Hear it played</p>
    ${playAlongPanel()}

    <p class="eyebrow" style="margin-top:24px">How did it go?</p>
    <div class="row">
      <button class="btn primary" id="cleanbtn">Played it clean</button>
      <button class="btn" id="stumble">I stumbled</button>
    </div>
    <div class="stats" style="justify-content:flex-start;margin-top:14px">
      <div class="stat"><b>${stepCleanCount(stepIndex())}/${WINDOW_TARGET}</b><span>this step</span></div>
      <div class="stat"><b>${STEPS.filter((_, i) => stepPassed(i)).length}/${STEPS.length}</b><span>steps cleared</span></div>
      <div class="stat"><b>${S.sight.attempts || 0}</b><span>attempted</span></div>
    </div>
    ${askBar ? `<div class="now" style="border-left-color:var(--red);margin-top:12px">
      <p class="eyebrow" style="color:var(--red)">Tap the bar that went wrong, above</p>
      <p style="margin:0 0 8px;font-size:14px">One tap and it moves on. Over a few of these the app can tell you what the bars you trip on have in common.</p>
      <div class="row">
        <button class="btn small" data-bar="skip">Not sure</button>
      </div>
    </div>` : ''}
    ${askBar ? '' : (() => {
      const i = stepIndex();
      const nextStep = i + 1 < STEPS.length ? i + 1 : null;
      if (!lastVerdict) return `<p style="font-size:13px;color:var(--soft);margin-top:8px;max-width:58ch">Either answer brings up a fresh melody \u2014 re-reading one you have already seen is not sight-reading, and you can always bring the old one back.</p>`;
      if (justClearedStep) return `<div class="now" style="border-left-color:var(--blue);margin-top:12px">
        <p class="eyebrow" style="color:var(--blue)">Step ${i + 1} cleared</p>
        <p style="margin:0;font-size:14px">${nextStep === null
          ? 'That is the last step on the ladder.'
          : `Next: <b>${nextStep + 1}. ${STEPS[nextStep].label}</b> \u2014 ${STEPS[nextStep].why}`}</p>
        <div class="row" style="margin-top:10px">
          ${nextStep === null ? '' : `<button class="btn primary small" data-step="${nextStep}">Go to step ${nextStep + 1}</button>`}
          <button class="btn small" data-step="${i}">Stay on this one</button>
        </div>
      </div>`;
      return `<div class="now" style="border-left-color:${lastVerdict === 'clean' ? 'var(--blue)' : 'var(--red)'};margin-top:12px">
        <p style="margin:0;font-size:14px">Counted \u2014 ${windowProgressText(i)} to clear step ${i + 1}. ${lastVerdict === 'clean'
          ? 'New melody below.'
          : 'A fresh melody is up; re-reading one you have already seen is not sight-reading.'}</p>
        <div class="row" style="margin-top:8px">
          <button class="btn small" id="keeplast">Bring back the last one to work on</button>
        </div>
      </div>`;
    })()}

    <p class="eyebrow" style="margin-top:24px">Check the rhythm</p>
    ${rhythmPanel()}

    ${keyIdentified ? `<details class="ref" open style="margin-top:4px">
      <summary>Where do my fingers go?</summary>
      <div style="margin-top:12px">${fingeringDiagram(mel)}</div>
    </details>` : ''}
    <div class="row" style="margin-top:16px">
      <button class="btn primary" id="fresh">New melody</button>
      <button class="btn" id="hear" ${S.muted ? 'disabled' : ''}>Hear it</button>
    </div>
    ${metronomeHTML()}
    ${stepPicker()}
    ${insightPanel()}

    <p class="eyebrow" style="margin-top:22px">Keys and mode</p>
    <p style="font-size:14px;max-width:58ch;margin:0 0 8px">${followingDefaults()
      ? `Set by step ${stepIndex() + 1}: <b>${defaultMode() === 'mixed' ? 'major and minor mixed' : 'major only'}</b>, drawn from ${allowedKeys().join(', ')} in shuffled order. You should not need to touch this.`
      : `<b style="color:var(--red)">Overridden.</b> ${effMode() === 'mixed' ? 'Major and minor' : effMode() === 'minor' ? 'Minor only' : 'Major only'}, ${S.sight.key === 'random' ? 'keys mixed' : 'key of ' + S.sight.key}${S.sight.allKeys ? ', all seven unlocked' : ''}.`}</p>
    ${followingDefaults() ? '' : '<div class="row" style="margin-bottom:8px"><button class="btn small" id="followdefaults">Go back to following the stage</button></div>'}

    <details class="ref" ${followingDefaults() ? '' : 'open'}>
      <summary>Choose a key or mode by hand</summary>
      <div style="margin-top:12px">
    <p class="eyebrow">Major or minor</p>
    <div class="row">
      ${[['major','Major'],['minor','Minor'],['mixed','Mixed']].map(([id, lbl]) =>
        `<button class="btn small ${effMode() === id ? 'primary' : ''}" data-mode2="${id}">${lbl}</button>`).join('')}
    </div>
    <p class="eyebrow" style="margin-top:20px">Key signature</p>
    <div class="row">
      ${['random'].concat(allowedKeys()).map(k =>
        `<button class="btn small ${(S.sight.key || 'random') === k ? 'primary' : ''}" data-key="${k}">${k === 'random' ? 'Mixed' : k}</button>`).join('')}
    </div>
    <label class="check" style="margin-top:8px">
      <input type="checkbox" id="allkeys" ${S.sight.allKeys ? 'checked' : ''}>
      <span>Use all seven keys, ignoring the stage limit</span>
    </label>
    <p style="font-size:13px;color:var(--soft);margin-top:4px;max-width:58ch">${S.sight.allKeys
      ? 'All seven. B\u266d and E\u266d put two and three fingers on black keys, which is a real jump in hand shape \u2014 that is what the staging was protecting you from, not the reading.'
      : `Step ${stepIndex() + 1} uses ${allowedKeys().join(', ')}.`} Mixed cycles through them in shuffled order, so every key comes up before any repeats \u2014 reading a signature you did not choose is the actual skill.</p>
      </div>
    </details>
    <details class="ref" id="whybox" ${S.whySeen ? '' : 'open'} style="margin-top:26px">
      <summary>Why does minor raise its 7th? \u2014 play it and hear why</summary>
      <div style="margin-top:14px">${renderWhy(explainKey)}</div>
    </details>
    <p style="font-size:13px;color:var(--soft);margin-top:24px;max-width:56ch">Only call it clean if you got through without stopping and without a wrong note you noticed. Clearing a step takes ${WINDOW_TARGET} clean reads out of your last ${WINDOW} at it \u2014 more evidence than a bare streak, and one stumble does not erase your progress; it just ages out after ${WINDOW} more attempts.</p>`;
  justClearedStep = false;

  v.querySelectorAll('[data-keyid]').forEach(b => b.onclick = () => {
    if (b.dataset.keyid === mel.key.name) { keyIdentified = true; keyIdMsg = ''; }
    else keyIdMsg = 'Not quite \u2014 look again.';
    renderSight();
  });
  document.getElementById('fresh').onclick = () => {
    stopPlayAlong(true);
    if (tapState !== 'off') stopRhythm();
    prevMel = null; lastVerdict = null; askBar = false;
    newMelody(); renderSight();
  };
  v.querySelectorAll('[data-key]').forEach(b => b.onclick = () => {
    S.sight.key = b.dataset.key; save(); newMelody(); renderSight();
  });
  v.querySelectorAll('[data-focus]').forEach(b => b.onclick = () => {
    S.sight.focus = b.dataset.focus === 'none' ? null : b.dataset.focus;
    S.sight.focusChosen = true;
    save(); newMelody(); renderSight();
  });
  const cs = document.getElementById('clearstumbles');
  if (cs) cs.onclick = () => {
    S.stumbles = []; S.sight.focus = null; S.sight.focusChosen = false; save(); renderSight();
  };
  v.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
    S.sight.step = +b.dataset.step;
    save(); newMelody(); renderSight();
  });
  const ak = document.getElementById('allkeys');
  if (ak) ak.onchange = () => {
    S.sight.allKeys = ak.checked;
    if (!allowedKeys().includes(S.sight.key)) S.sight.key = 'random';
    keyBag = []; save(); newMelody(); renderSight();
  };
  v.querySelectorAll('[data-mode2]').forEach(b => b.onclick = () => {
    S.sight.mode = b.dataset.mode2 === defaultMode() ? null : b.dataset.mode2;
    save(); newMelody(); renderSight();
  });
  const fd = document.getElementById('followdefaults');
  if (fd) fd.onclick = () => {
    S.sight.mode = null; S.sight.key = 'random'; S.sight.allKeys = false;
    keyBag = []; save(); newMelody(); renderSight();
  };
  const why = document.getElementById('whybox');
  if (why) {
    wireWhy(why, explainKey);
    why.ontoggle = () => { if (!S.whySeen) { S.whySeen = true; save(); } };
  }
  const h = document.getElementById('hear');
  if (h) h.onclick = () => { h.textContent = 'Playing\u2026'; playMelody(72); };
  wireRhythm(v);
  wireMetronome(v);
  wirePlayAlong(v);
  document.getElementById('cleanbtn').onclick = () => {
    const i = stepIndex();
    S.sight.attempts = (S.sight.attempts || 0) + 1;
    justClearedStep = recordStepOutcome(i, 'ok');
    save();
    prevMel = mel; lastVerdict = 'clean';
    stopPlayAlong(true);
    if (tapState !== 'off') stopRhythm();
    newMelody(); renderSight(); renderNow();
  };
  document.getElementById('stumble').onclick = () => {
    const i = stepIndex();
    S.sight.attempts = (S.sight.attempts || 0) + 1;
    if (!stepPassed(i)) recordStepOutcome(i, 'no');
    save();
    stopPlayAlong(true);
    if (tapState !== 'off') stopRhythm();
    askBar = true;                       // which bar? one tap, then move on
    renderSight();
  };
  let barLocked = false;
  const finishStumble = idx => {
    if (idx !== 'skip') recordStumble(mel, +idx);
    askBar = false;
    prevMel = mel; lastVerdict = 'stumble';
    newMelody(); renderSight(); renderNow();
  };
  const activateBar = b => {
    if (barLocked) return;
    barLocked = true;
    v.querySelectorAll('[data-bar]').forEach(other => {
      other.disabled = true;
      other.setAttribute('aria-disabled', 'true');
      other.style.pointerEvents = 'none';
    });
    if (b.classList.contains('stumble-hit')) b.classList.add('flash');
    stumbleTimer = setTimeout(() => { stumbleTimer = null; finishStumble(b.dataset.bar); }, 250);
  };
  v.querySelectorAll('[data-bar]').forEach(b => {
    b.onclick = () => activateBar(b);
    b.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activateBar(b); }
    };
  });
  const keep = document.getElementById('keeplast');
  if (keep) keep.onclick = () => {
    if (!prevMel) return;
    mel = prevMel; prevMel = null; lastVerdict = null;
    renderSight();
  };
}

// ---------- learn tab ----------
// everything explanatory lives here. the in-context panels elsewhere are

const learnMinorKey = () => {
  const k = KEYS[namingIdx];
  return MINOR_OK.includes(k.name) ? k : keyByName('C');
}

const renderLearn = () => {
  const v = document.getElementById('view');
  const mk = learnMinorKey();
  const minorName = raisedSeventhFacts(mk).tonicName + ' minor';

  v.innerHTML = `
    <p class="eyebrow">Explanations, not drills</p>
    <h2>Learn</h2>
    <p style="max-width:56ch;font-size:14px">Nothing here needs doing in order. Open what you are stuck on.</p>

    <details class="ref" id="learn-sound">
      <summary>No sound?</summary>
      <div style="margin-top:12px">
        <div class="row">
          <button class="btn" id="soundtest">Play a test note</button>
          <button class="btn small" id="soundtoggle">${S.muted ? 'Sound is off' : 'Sound is on'}</button>
        </div>
        <p id="soundstate" style="font-size:14px;color:var(--soft);margin-top:10px;max-width:56ch">Tap the test note.</p>

        <p style="font-size:13px;color:var(--soft);max-width:58ch;margin-top:8px"><b>Media element</b> synthesises each sound into an audio file and plays it through a media element, which iOS exempts from the silent switch. Slightly slower to start, and the only thing that works inside an app\u2019s built-in browser. <b>Web Audio</b> responds instantly but the switch silences it. Auto picks media element on iOS.</p>
        <div id="audiodiag">${audioDiagnostics()}</div>

    <details class="ref" open>
      <summary>Reading the staff: four landmarks</summary>
      <div style="margin-top:12px">
        <p style="max-width:58ch;font-size:14px">Memorise these four cold, then read every other note as one or two steps from the nearest one. Mnemonics make you count up from a letter every time, which caps your reading speed permanently.</p>

        <ul style="font-size:14px;max-width:60ch;padding-left:18px">

  const ig = document.getElementById('ignoresilent');
  if (ig) ig.onchange = () => {

// ---------- progress ----------
const renderProgress = () => {
  const cleared = STEPS.filter((_, i) => stepPassed(i)).length;
  const cur = stepIndex(), unlocked = unlockedThrough();
  document.getElementById('view').innerHTML = `
    <p class="eyebrow">Where you are</p>
    <h2>${cleared} of ${STEPS.length} steps cleared</h2>
    <div>
      ${STEPS.map((s, i) => {
        const done = stepPassed(i), now = i === cur, locked = i > unlocked;
        return `<div class="stage" style="${locked ? 'opacity:.5' : ''}">
          <button class="stagehead" data-gostep="${i}">
            <span class="stagenum">${done ? '\u2713' : i + 1}</span>
            <span class="stagename">${s.label}</span>
            <span class="badge ${done ? 'done' : now ? 'now' : ''}">${
              done ? 'cleared' : now ? 'current \u00b7 ' + stepCleanCount(i) + '/' + WINDOW_TARGET
              : locked ? 'locked' : stepCleanCount(i) + '/' + WINDOW_TARGET}</span>
          </button>
          ${now ? `<div class="stagebody"><p>${s.why}</p>
            <p style="font-size:13px;color:var(--soft)">${s.keys.length === 1 ? 'Key of ' + s.keys[0]
              : s.keys.length + ' keys: ' + s.keys.join(', ')} \u00b7 ${s.mode === 'mixed' ? 'major and minor' : 'major'}
              \u00b7 ${s.rhythm >= 3 ? 'with eighth notes' : 'quarters, halves and wholes'}</p></div>` : ''}
        </div>`;
      }).join('')}
    </div>
    <p style="margin-top:18px;font-size:14px;color:var(--soft);max-width:58ch">${WINDOW_TARGET} of your last ${WINDOW} clean reads clears a step and opens the next \u2014 not a streak, so one stumble does not undo your progress. Explanations for anything here \u2014 landmarks, key signatures, minors, fingering \u2014 are in the <b>Learn</b> tab.</p>
    <div id="sesspane" style="margin-top:34px;border-top:1px solid var(--rule);padding-top:22px"></div>
    <div id="logpane" style="margin-top:34px;border-top:1px solid var(--rule);padding-top:22px"></div>`;
  renderPractice('sesspane');
  renderLog('logpane');
  document.querySelectorAll('[data-gostep]').forEach(b => b.onclick = () => {
    S.sight.step = +b.dataset.gostep; save(); newMelody(); switchTab('sight');
  });
}

// ---------- what to do next ----------
const nextAction = () => {
  const st = S.drill;
  const loggedToday = S.log.some(e => e.date === today());

  if (S.session) return { tab: 'progress', text: 'You have a session open. Finish the slots, then log it.' };

  if (!S.primerSeen) return { tab: 'reading',
    text: 'Two minutes first: the four bass-clef landmarks. Everything else reads off them, so this is the one thing worth doing before anything else.' };

  if (st.asked === 0) return { tab: 'reading',
    text: 'One round of the note drill \u2014 twenty notes, naming what you see. It is the fastest way to stop counting up from a landmark every time.' };

  const cur = stepIndex(), unlocked = unlockedThrough();
  const next = STEPS.findIndex((_, i) => !stepPassed(i));

  if (next === -1) return { tab: 'sight',
    text: 'Every step on the ladder is cleared. Keep reading \u2014 mixed keys, both hands, shifts \u2014 and the real next move is repertoire away from the app.' };

  if (cur !== next && stepPassed(cur)) return { tab: 'sight',
    text: `Step ${cur + 1} is cleared. Step ${next + 1} of ${STEPS.length} \u2014 ${STEPS[next].label} \u2014 is where the work is now.` };

  if (!stepPassed(cur)) return { tab: 'sight',
    text: `Step ${cur + 1} of ${STEPS.length}: ${STEPS[cur].label}. ${windowProgressText(cur)} clears it and opens the next.` };

  if (!loggedToday) return { tab: 'progress',
    text: 'Reading is moving. Pick how long you have and work the slots \u2014 the repertoire slot is the one the app cannot do for you.' };

  return { tab: 'sight',
    text: 'Logged for today \u2014 that is enough. If you want more, one more melody is the best use of a spare five minutes.' };
}

// While a session slot is still open, the strip shows live controls for it
// instead of the generic directive — that is the one thing worth seeing and
// touching from any tab, since the whole point of a session timer is staying
// visible while you are doing something else (reading, drilling).
const sessionStripBlock = () => {
  const s = S.session;
  const i = s.slots.findIndex(x => !x.done);
  if (i < 0) return null;
  const x = s.slots[i], def = SLOTS[x.id];
  return `<div class="now">
    <p class="eyebrow">Session running \u00b7 slot ${i + 1} of ${s.slots.length}</p>
    <p><b>${def.name}</b></p>
    <div class="row" style="align-items:baseline;gap:10px">
      <span class="nowclk" style="font-family:var(--mono);font-size:22px">${fmt(slotLeft(x))}</span>
      <button class="btn small" data-nowtoggle="${i}">${x.running ? 'Pause' : x.spent > 0 ? 'Resume' : 'Start'}</button>
      <button class="btn small" data-nowdone="${i}">Done</button>
    </div>
  </div>`;
};

const renderNow = () => {
  const a = nextAction();
  const here = tab === a.tab;
  const sess = S.session ? sessionStripBlock() : null;
  const block = (withBtn) => sess || `<div class="now">
    <p class="eyebrow">Do this now</p>
    <p>${a.text}</p>
    ${withBtn ? '<div class="row"><button class="btn primary small" data-goto="1">Take me there</button></div>' : ''}
  </div>`;
  document.getElementById('now').innerHTML = block(!here);
  // long views (drill keyboard, session slots) push the top strip off screen
  const foot = document.getElementById('nowfoot');
  const showFoot = !(tab === 'reading' && !S.primerSeen);
  foot.innerHTML = showFoot ? `<div style="margin-top:28px">${block(!here)}</div>` : '';
  document.querySelectorAll('[data-nowtoggle]').forEach(b => b.onclick = () => toggleSlot(+b.dataset.nowtoggle));
  document.querySelectorAll('[data-nowdone]').forEach(b => b.onclick = () => finishSlot(+b.dataset.nowdone));
  document.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => switchTab(a.tab));
  document.querySelectorAll('nav button').forEach(b =>
    b.classList.toggle('rec', b.dataset.tab === a.tab && !here));
}

const readingTrend = () => {
  const all = S.drill.rounds;
  if (!all.length) return '';
  const rs = all.slice(-18);
  const W = 420, H = 104, PADL = 4, PADR = 4;
  const target = Math.min(...rs.map(r => TARGET[r.mode] || 3));
  const yMax = Math.max(target * 1.25, ...rs.map(r => r.per)) * 1.05;
  const x = i => PADL + (rs.length === 1 ? (W - PADL - PADR) / 2 : i * (W - PADL - PADR) / (rs.length - 1));
  const y = v => H - 14 - (v / yMax) * (H - 24);

  const pts = rs.map((r, i) => `${x(i).toFixed(1)},${y(r.per).toFixed(1)}`).join(' ');
  const dots = rs.map((r, i) => {
    const clean = r.correct === ROUND_LEN;
    return `<circle cx="${x(i).toFixed(1)}" cy="${y(r.per).toFixed(1)}" r="3.2"
      fill="${clean ? 'var(--blue)' : 'var(--red)'}" stroke="var(--page)" stroke-width="1">
      <title>${r.date} \u00b7 ${r.mode} \u00b7 ${r.correct}/${ROUND_LEN} \u00b7 ${r.per}s per note</title></circle>`;
  }).join('');

  const first = rs[0].per, last = rs[rs.length - 1].per;
  const delta = rs.length > 2
    ? (last < first
        ? `Down from ${first.toFixed(1)}s to ${last.toFixed(1)}s per note \u2014 that is recognition replacing counting.`
        : `Flat or up, ${first.toFixed(1)}s to ${last.toFixed(1)}s. Not a problem yet; it moves in steps, not a line.`)
    : 'Two more rounds and a trend becomes readable.';

  return `<p class="eyebrow">Reading rounds \u00b7 seconds per note \u00b7 lower is better</p>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img"
      aria-label="Trend of seconds per note across ${rs.length} rounds">
      <line x1="${PADL}" y1="${y(target)}" x2="${W - PADR}" y2="${y(target)}"
        stroke="var(--rule)" stroke-dasharray="4 4"/>
      <text x="${W - PADR}" y="${y(target) - 5}" text-anchor="end" font-size="9"
        fill="var(--soft)" font-family="ui-monospace, monospace">target ${target}s</text>
      <polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="1.6"/>
      ${dots}
    </svg>
    <p style="font-size:13px;color:var(--soft);margin-top:6px">
      ${all.length} round${all.length === 1 ? '' : 's'} recorded. Red dots are rounds with a wrong answer. ${delta}</p>`;
}

// ---------- shell ----------
let tab = 'sight';
// The one path that has to work even when saved data has a shape this
// version doesn't handle \u2014 a render triggered from here has nowhere else
// to fall back to (no other tab is guaranteed to render either, since any
// of them can read the same broken S). Shown for a bootstrap failure AND
// for any later render() failure, e.g. switching tabs after S ended up null.
const showFatalError = (e) => {
  console.error('Failed to render', e);
  const v = document.getElementById('view');
  v.innerHTML = `
    <p class="eyebrow" style="color:var(--red)">Something went wrong loading your progress</p>
    <p style="max-width:56ch;font-size:13px;font-family:var(--mono);color:var(--soft)">${(e && e.message) || String(e)}</p>
    <p style="max-width:56ch;font-size:14px">This usually means saved progress has a shape this version does not expect. Trying again costs nothing; clearing starts the ladder over from step 1 and loses the practice log and stumble history on this device.</p>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="bootretry">Try again</button>
      <button class="btn primary" id="bootreset">Clear my progress and start over</button>
    </div>`;
  document.getElementById('bootretry').onclick = () => location.reload();
  document.getElementById('bootreset').onclick = () => {
    if (confirm('This clears all saved progress, drill stats, and practice log on this device. Continue?')) {
      try { localStorage.removeItem(KEY); } catch (e2) { /* nothing more to try */ }
      location.reload();
    }
  };
};

const switchTab = (t) => {
  tab = t;
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.tab === t));
  render();
}
const render = () => {
  // the session ticker is no longer tied to any one tab — it has to keep
  // running so the persistent strip can show a live countdown from anywhere
  if (tab !== 'sight' && stumbleTimer) { clearTimeout(stumbleTimer); stumbleTimer = null; }
  try {
    ({ reading: renderReading, sight: renderSight,
       learn: renderLearn, progress: renderProgress })[tab]();
    renderNow();
  } catch (e) {
    showFatalError(e);
  }
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

(async () => {
  const v = document.getElementById('view');
  v.innerHTML = '<p class="empty-state">Loading\u2026</p>';
  try {
    S = await load();
    // land where the work is. Only the landmark primer and an open session
    // outrank reading music.
    tab = !S.primerSeen ? 'reading' : S.session ? 'progress' : nextAction().tab;
    document.querySelectorAll('nav button').forEach(b =>
      b.setAttribute('aria-selected', b.dataset.tab === tab));
    renderSpine();
    render();
  } catch (e) {
    // deliberately leave S as whatever it was (often still null) — falling
    // back to blank() here would make other tabs quietly usable again, and
    // the first save() from that state would overwrite real (if broken)
    // saved data with a blank slate with no explicit confirmation. Every
    // render() call while S can't be trusted should hit the same error
    // screen consistently, via render()'s own try/catch, until the user
    // explicitly retries or resets.
    showFatalError(e);
  }
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {
      // offline support is a nicety, not a requirement — a registration
      // failure (unsupported browser, blocked by an embedding webview)
      // should never stop the app itself from working
    });
  });
}
</script>
