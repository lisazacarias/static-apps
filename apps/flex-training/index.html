<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../../shared/base.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <header class="top">
        <h1>Flex Training</h1>
        <p class="subtitle">Plan your week around your classes, tick off sessions, time your holds, look up a movement.</p>
        <nav class="tabs" aria-label="Views">
            <a href="#week" data-tab="week">Week</a>
            <a href="#sessions" data-tab="sessions">Sessions</a>
            <a href="#moves" data-tab="moves">Movements</a>
            <a href="#guide" data-tab="guide">Guide</a>
            <a href="#history" data-tab="history">History</a>
        </nav>
    </header>

    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <main id="view"></main>
</div>

<div id="timer" class="timer" hidden>
    <div class="timer-label" id="timerLabel"></div>
    <div class="timer-time" id="timerTime">0:00</div>
    <button id="timerToggle" class="btn" type="button">Pause</button>
    <button id="timerReset" class="btn" type="button">Reset</button>
    <button id="timerClose" class="btn" type="button" aria-label="Close timer">×</button>
</div>

<div id="player" class="player" hidden role="dialog" aria-label="Guided session">
    <div class="play-top">
        <span id="playHead" class="label"></span>
        <button id="playClose" class="btn" type="button" aria-label="Close and save">×</button>
    </div>
    <div class="play-clock">
        <div id="playStep" class="play-step"></div>
        <div id="playTime" class="play-time">0:00</div>
    </div>
    <div class="play-controls">
        <button id="playBack" class="btn" type="button">‹ Back</button>
        <button id="playToggle" class="btn" type="button">Pause</button>
        <button id="playDone" class="btn primary" type="button">✓ Done</button>
        <button id="playSkip" class="btn" type="button">Skip ›</button>
    </div>
    <div id="playBody" class="play-body"></div>
</div>

<input id="backupFile" type="file" accept=".json,application/json" hidden>

<script type="module" src="app.js"></script>
</body>
</html>
